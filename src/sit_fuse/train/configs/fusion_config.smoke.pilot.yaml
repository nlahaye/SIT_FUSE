# PILOT GOES-18 (recalibrated) + TEMPO smoke fusion fit: a few days only, to create fusion_models.pkl quickly.
#   python list_fusion_splits.py configs/fusion_config.smoke.yaml          # pick the dates below
#   python fuse_multiscale_products.py -c configs/fusion_config.smoke.pilot.yaml --stage fit -n 8   # weights only
#   python fuse_multiscale_products.py -c configs/fusion_config.smoke.pilot.yaml --stage all -n 8   # + holdout check
# Writes to the same output_dir as fusion_config.smoke.yaml, so production_2026.yaml (models_from) picks it up.
# Production must keep reading fusion_config.smoke.yaml (no temporal.dates), not this file.
# A later full fit with fusion_config.smoke.yaml overwrites these pilot weights.
product: smoke
output_dir: /data/nlahaye/output/Learnergy/FUSION/UQ_SMOKE_RECAL   # new dir: weights fit to the recalibrated GOES

sources:
  tempo:
    geo_dir: /data/nlahaye/output/Learnergy/SF_TEMPO_V04/UQ/geo   # CHECK: TEMPO geo_export.output_dir
    manifest: /data/nlahaye/output/Learnergy/SF_TEMPO_V04/UQ/geo/geo_products_manifest.json
    model: hist_gradient_boosting
    frames: {mode: scan}                 # one E-W TEMPO scan per frame
    default_logit_sd: 1.0                # used where ensemble q05/q95 bands are missing
    min_logit_sd: 0.05
  goes:
    geo_dir: /data/nlahaye/output/Learnergy/GOES_TEMPO_UPDATED/UQ_SMOKE_RECAL/geo   # geo_export.output_dir of g18_uq_config_smoke_recal.yaml
    manifest: /data/nlahaye/output/Learnergy/GOES_TEMPO_UPDATED/UQ_SMOKE_RECAL/geo/geo_products_manifest.json
    model: hist_gradient_boosting
    frames: {mode: time, minutes: 10}    # ABI CONUS scenes binned to 10 min (hourly production: one scene per bin)
    default_logit_sd: 1.0

grids:
  fine:   {from: goes}                   # ABI grid (about 2 km)
  coarse: {from: tempo}                  # TEMPO product grid (about 70 km2 cells)
  # or explicit: {bounds: [-125, 32, -114, 46], resolution: 0.02, crs: EPSG:4326}

change_of_support:
  smoke_aggregate: mean                  # fine -> coarse: area-weighted mean probability
  disaggregation_logit_var: 0.25
  min_coverage: 0.5

temporal:
  output_times: goes                     # goes | tempo | union
  match_window_minutes: 5
  goes_pool: mean_logit
  causal: true                           # TEMPO carried forward only from earlier scans
  tempo_lookahead_minutes: 5
  carry_forward_max_minutes: 90
  carry_forward_sd_per_hour: 0.5
  dates: ["CAL_DATE_1", "CAL_DATE_2", "2025-01-11"]   # PILOT: 2-3 "calibration days with both sensors" + 1 holdout day
                                                 # (2025-01-11 was holdout for both sensors in the last evaluations)

references:
  adp_smoke:                             # TEMPO-ABI ADP: uses ABI tests, so not independent of GOES - CHECK path
    glob: /data/nlahaye/remoteSensing/data_pull/tempo_adp/rasters/smoke_*.tif
    tolerance_minutes: 10
  viirs_smoke:                           # VIIRS Deep Blue aerosol type, nearest overpass - CHECK path
    glob: /data/nlahaye/remoteSensing/data_pull/viirs_aerosol_type/rasters/viirs_smoke_*.tif
    tolerance_minutes: 30

fusion:
  fit_reference: adp_smoke
  fit_split: calibration
  # fit_split: dev                      # PILOT fallback only if no calibration day has both sensors (dev scenes
                                       # trained the classifiers, so the weights will favour overconfident inputs)
  eval_split: holdout
  grids: [fine, coarse]
  l2: 1.0e-3
  recalibration: none                    # none | temperature | platt | isotonic (GOES is already Platt-recalibrated;
                                         # try platt here if fusion_reliability.csv shows compressed fused probabilities)
  threshold_metric: f1
  threshold_grid: {scale: linear, min: 0.02, max: 0.95, n: 94}
  max_negatives_per_frame: 5000      # PILOT (full: 20000)
  max_positives_per_frame: 5000      # PILOT (full: 20000)
  seed: 0
  reliability_bins: 10                   # fusion_reliability.csv
  # models_from: <fitted output_dir>     # apply / merge with weights fitted elsewhere (production)

output:
  splits: [holdout]                      # PILOT: only the holdout day is written (full: [calibration, holdout, dev])
