# GOES-18 fire production for the Oregon fires on 26 July 2026 with the TEMPO-style GOES fire model
# (goes18/g18_uq_config_fire_ts.yaml, output_dir .../UQ_FIRE_TS2026), set up like the smoke 0726 run: every 5-min
# ABI CONUS scene (sensors.goes.every_minutes unset), hist_gradient_boosting, geo products, and the GOES + TEMPO fire
# fusion at the same 5-min cadence (weights of configs/fusion_config.fire_ts.yaml -> FUSION/UQ_FIRE_TS, fitted at
# 5 min in the same plan; TEMPO fire carried forward from the evaluation geo products where 26 July is in them).
# Same scenes and bbox as production_2026_fire_0726.yaml; only the trained model differs.
# Run as part of uq_parallel.goes_fire_ts_2026.yaml (job prod_goes_fire_ts_0726, after the UQ_FIRE_TS2026 geo export),
# or alone after that run has finished:
#   python build_production_run.py production_2026_goes_fire_ts_0726.yaml --run
# Head outputs: smoke and fire share the GOES encoder (goes_tempo_test_3, GOES_TEMPO_UPDATED), so heads/goes_0 is filled
# from heads_from (per file, tag-checked): the smoke 0726 production's heads (same 5-min scenes, exported first in the
# plan by prod_heads_0726), then the other GOES productions and evaluation dirs. Nothing is exported when all exist.

# 30-MIN (storage): sensors.goes.every_minutes 30 -> one scene per 30-min UTC bin (heads, inference, geo, fusion).
# A finished 5-min run is not rerun by the plan (same command); prune_off_cadence_30min.yaml thins its outputs to
# these scenes. An unfinished one continues at 30 min (new scenes.yaml -> new nested commands; inference reuses
# the scene checkpoints, the geo export skips existing rasters). The 5-min fusion weights apply unchanged.
output_root: /data/nlahaye/output/Learnergy/PRODUCTION_2026_07_OR0726_FIRE_TS
start: 2026-07-26T12:00:00Z
end: 2026-07-27T06:00:00Z
bbox: [-125.0, -110.0, 40.0, 49.0]
python: python
resume: true
launcher:
  cpus: 16
  gpus: [0, 1, 2, 3]                   # the smoke 0726 production uses 4-7
  state_dir: /data/nlahaye/output/Learnergy/PRODUCTION_2026_07_OR0726_FIRE_TS/launch
resources: {infer: 4, infer_merge: 2, geo: 4}
shards: {inference: 8}
export: {shards: 4, cpus: 4, gpu: 1}

sensors:
  goes:
    inputs: /data/nlahaye/remoteSensing/GOES_TEMPO/new_data_2026_07     # CHECK
    pattern: "OR_ABI-L1b-RadC-M6C01_G18_s*.tif"
    every_minutes: 30                   # 30-MIN: first input per 30-min UTC bin (~36 scenes; was every 5-min scene)
    bbox_filter: false
    heads_from:                         # same-encoder head outputs to link instead of exporting (recursive, tag-checked)
      - /data/nlahaye/output/Learnergy/PRODUCTION_2026_07_OR0726_SMOKE/heads      # smoke 0726 production (same scenes)
      - /data/nlahaye/output/Learnergy/PRODUCTION_2026_07_FIRE/heads              # fire 0726 production
      - /data/nlahaye/output/Learnergy/PRODUCTION_2026_07/heads                   # smoke quick test (hourly scenes)
      - /data/nlahaye/output/Learnergy/GOES_TEMPO_UPDATED                         # smoke / fire evaluation heads

pipelines:
  goes_fire:
    sensor: goes
    uq_config: goes18/g18_uq_config_fire_ts.yaml         # TEMPO-style GOES fire run
    export_config: goes18/g18_export_fire.yaml           # GOES encoder (goes_tempo_test_3), shared with smoke
    models: [hist_gradient_boosting]

fusion:                                 # 5-min fused fire: frozen weights from the 5-min evaluation fit
  fire_ts:
    config: configs/fusion_config.fire_ts.yaml           # goes frames 5 min, match window 2 min
    models_from: /data/nlahaye/output/Learnergy/FUSION/UQ_FIRE_TS            # fusion_models.pkl (fusion fire_ts of the plan)
    pipelines:
      goes: goes_fire                                    # this run: every 5-min scene
      tempo: {geo_dir: /data/nlahaye/output/Learnergy/SF_TEMPO_V04/UQ_FIRE/geo}   # TEMPO fire evaluation geo (all scenes); GOES-only frames where 26 July is absent
    shards: 4
    cpus: 2
