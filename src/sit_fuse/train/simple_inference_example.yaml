output_dir: output/inference_final
model_path: /data/models/logistic_regression.joblib
training_summary_path: /data/models/training_summary.json

bootstrap_model_paths:
  - /data/models/logistic_regression_bootstrap_000.joblib
  - /data/models/logistic_regression_bootstrap_001.joblib
  - /data/models/logistic_regression_bootstrap_002.joblib
  - /data/models/logistic_regression_bootstrap_003.joblib
  - /data/models/logistic_regression_bootstrap_004.joblib
  - /data/models/logistic_regression_bootstrap_005.joblib
  - /data/models/logistic_regression_bootstrap_006.joblib
  - /data/models/logistic_regression_bootstrap_007.joblib
  - /data/models/logistic_regression_bootstrap_008.joblib
  - /data/models/logistic_regression_bootstrap_009.joblib

features:
  window_radii: [1, 3, 5]
  cross_scale_deltas: true
  cluster_nodata: -9999
  annotation_nodata: -9999

  hashed_histogram:
    enabled: true
    n_bins: 32

  coarse_context_mapping:
    0: [1, 2, 3, 4, 5]
    1: [10, 11, 12, 13]
    2: [20, 21, 22]
    3: [30, 31, 32, 33, 34]

rasters:
  - pair_id: scene_2019_06_10
    cluster_raster: /data/sit_fuse/scene_2019_06_10_clusters.tif

  - pair_id: scene_2019_06_24
    cluster_raster: /data/sit_fuse/scene_2019_06_24_clusters.tif


