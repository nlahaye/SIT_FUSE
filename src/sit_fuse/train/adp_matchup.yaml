# =============================================================================
# SIT-FUSE ↔ ADP Smoke Matchup Generator
#
# Run:
#   python build_sit_fuse_adp_smoke_matchups.py adp_smoke_matchups.yaml
#
# ADP smoke filename format expected by this configuration:
#   smoke_YYYYMMDDTHHMMSSZ.tif
#
# Example:
#   smoke_20240728T000501Z.tif
# =============================================================================

# The temporal search range for both SIT-FUSE and ADP smoke files.
# All timestamps are interpreted as UTC.
time_range:
  start: "2024-07-23T00:00:00Z"
  end: "2024-07-31T23:59:59Z"

# -----------------------------------------------------------------------------
# Context-free SIT-FUSE cluster-raster outputs
# -----------------------------------------------------------------------------
sit_fuse:
  # Root directory searched recursively for SIT-FUSE GeoTIFF files.
  directory: /data/nlahaye/output/Learnergy/SF_TEMPO_PARK/

  patterns:
    # Must contain exactly one capture group holding the scene timestamp.
    #
    # This generic pattern finds a timestamp anywhere in the filename, such as:
    # TEMPO...20240728T000501Z...fullgeo.tif
    timestamp_patterns:
      - "(?i)(\\d{8}T\\d{6}Z)"

  context_free_filters:
    # Include only final, georeferenced SIT-FUSE cluster products.
    #
    # Adjust this pattern to the stable final-product marker in your file names.
    # The following is suitable for names ending in ".fullgeo.tif".
    include_patterns:
      - "(?i)full_geo\\.tif$"

    # Exclude files that may be colocated in the same source directory but are
    # not the context-free discrete SIT-FUSE cluster raster.
    exclude_patterns:
      - "(?i)Contour"
      - "(?i)smoke"
      - "(?i)ImFill"
      - "(?i)Edged"
      - "(?i)merged"
      - "(?i)fire"
      #- "(?i)entropy"
      #- "(?i)margin"
      #- "(?i)aleatoric"
      #- "(?i)epistemic"

# -----------------------------------------------------------------------------
# Timestamped ADP smoke truth rasters
# -----------------------------------------------------------------------------
adp_smoke:
  # Root directory searched recursively for ADP smoke GeoTIFFs.
  directory: /home/nlahaye/SIT_FUSE/src/sit_fuse/preprocessing/data_pull/tempo_adp_out/rasters/

  patterns:
    # Only files beginning with "smoke_" are accepted as ADP smoke truth.
    include_patterns:
      - "(?i)^smoke_"

    # Must have exactly one capture group for YYYYMMDDTHHMMSSZ.
    #
    # Matches:
    #   smoke_20240728T000501Z.tif
    #   smoke_20240728T000501Z.tiff
    timestamp_patterns:
      - "(?i)^smoke_(\\d{8}T\\d{6}Z)\\.tiff?$"

# -----------------------------------------------------------------------------
# Temporal matching policy
# -----------------------------------------------------------------------------
matching:
  # Maximum allowed absolute time offset between a SIT-FUSE scene timestamp and
  # the selected ADP smoke truth raster timestamp.
  #
  # 900 seconds = 15 minutes.
  #
  # Use a tighter value, such as 300 seconds, if ADP smoke output is generated
  # near the same cadence as the SIT-FUSE/TEMPO inputs. Use a larger tolerance
  # only when the ADP product cadence warrants it.
  max_time_difference_seconds: 900

  # True means one ADP smoke raster may supervise multiple neighboring
  # SIT-FUSE acquisitions. This is normally appropriate for high-frequency
  # satellite scenes and avoids artificial unmatched samples.
  allow_adp_reuse: true

  # The pair ID is used by downstream grouped holdout and grouped
  # cross-validation.
  #
  # Recommended:
  # - adp_timestamp: keeps all SIT-FUSE scenes paired with one ADP raster in
  #   the same group, reducing truth-image leakage between folds.
  #
  # Other valid values:
  # - adp_day
  # - sit_fuse_timestamp
  # - sit_fuse_day
  group_by: adp_timestamp

# -----------------------------------------------------------------------------
# Base classifier configuration
# -----------------------------------------------------------------------------
classifier_config:
  # Existing classifier YAML with feature, model, split, and output settings.
  #
  # The matchup generator will copy this file, replace/add the `matchups`
  # section, and write the completed classifier config to output.classifier_yaml.
  base_yaml: ./basic_clssifier.yaml

# -----------------------------------------------------------------------------
# Output products from this matchup generator
# -----------------------------------------------------------------------------
output:
  # Classifier-ready YAML. This is the file you pass to the classifier training
  # script after confirming paths and feature settings.
  classifier_yaml: .//adp_smoke_classifier_matchups.yaml

  # Audit table containing matched, unmatched, and skipped files.
  audit_csv: .//adp_smoke_matchups_audit.csv

  # Top-level or dotted YAML location in the generated classifier config where
  # matchup records are written.
  matchup_key: matchups

# -----------------------------------------------------------------------------
# Encoder (DBN / cluster) split tracing + stratified classifier splits
# Append to any of: classifier_matchups.yaml (HMS), adp_matchup.yaml (ADP),
# fdcc_matchup.yaml (FDCC). Implemented in matchup_splits.py.
# -----------------------------------------------------------------------------
encoder_split:
  enabled: true
  # SIT-FUSE encoder/cluster training YAML; data.files_train / data.files_test
  sit_fuse_yaml: /home/nlahaye/SIT_FUSE/src/sit_fuse/config/model/tempo_park_st_bb.yaml
  # SIT-FUSE outputs are named basename(files_*[i][0]) + suffix; the longest
  # input basename prefixing the output name wins. key_patterns are a fallback
  # for renamed outputs (TEMPO granule key shown).
  key_patterns:
    - "(\\d{8}T\\d{6}Z_S\\d{3}G\\d{2})"
  # Dates of encoder-training inputs (used for the temporal buffer)
  date_pattern: "(\\d{8})T\\d{6}Z"
  unmatched_policy: drop            # drop | unknown (unknown is never calibration/holdout)
  encoder_train_policy: dev         # dev: may train classifiers; exclude: drop entirely

classifier_split:
  enabled: true
  group_by: date                    # date | block (block_days-wide windows)
  block_days: 3
  # Groups within buffer_days of any encoder-training date are not used for
  # calibration/holdout (multi-day plumes, adjacent swaths). buffer_policy:
  # dev (use for classifier training) | exclude
  buffer_days: 0
  # Observing day: group scenes by (scene time - day_start_utc_hour), not by
  # UTC date, so one daily scan sequence crossing 00 UTC stays in one group
  # (TEMPO over the US: ~11Z to ~01:30Z; 06Z falls in the nightly gap).
  # Remove the block to group by the reference date.
  observing_day:
    time_pattern: '(\d{8}T\d{6})Z'   # scene time from the SIT-FUSE input / output name
    day_start_utc_hour: 6
  # Merge groups that share a reference raster so one reference never spans
  # partitions. With daily references matched by UTC date, evening (00-02Z)
  # scenes use the next day's raster and consecutive days chain into one group.
  link_shared_truth: false
  min_partition_gap_hours: null      # optional: warn if any partitions are closer than this
  buffer_policy: dev
  holdout_fraction: 0.25            # of eligible (encoder_test, unbuffered) groups
  calibration_fraction: 0.2
  min_holdout_groups_per_stratum: 1      # strata with >= 2 eligible groups
  min_calibration_groups_per_stratum: 1  # strata with >= 3 eligible groups
  min_holdout_groups_total: 1            # overall floor (holdout takes priority)
  min_calibration_groups_total: 1        # overall floor; never leaves < 2 dev groups
  reserve_dev_group: auto                # auto: hold one eligible group back for dev only in strata
                                         # without encoder_train / buffer dev groups | always | never
  # Explicit partition for specific split groups (observing days), applied after
  # the stratified allocation. Eligible (encoder_test, outside buffer) groups only;
  # the "Groups for <event>" log line lists each event's days by partition.
  # assign_groups:
  #   calibration: ["2024-07-27"]
  #   holdout: ["2024-07-28"]
  random_state: 42
  stratify:
    # Strata = event window (else year-month) [x product] [x positive-fraction bin]
    event_windows:
      - {name: park_fire_2024, start: "2024-07-20", end: "2024-08-15"}
      - {name: la_fires_2025,  start: "2025-01-06", end: "2025-01-31"}
    by_product: false               # true for HMS runs with both smoke and fire
    positive_fraction:
      enabled: true                 # reads each truth raster once
      positive_values: null         # null -> value > 0; e.g. [1, 2, 3] for HMS density
      nodata_values: [255, -1]
      label_values: null            # values that are labels, never NoData; null = 0 + positive_values (or 1)
      raster_nodata: auto           # auto: ignore a raster NoData tag equal to a label (ADP NoData=0) | use | ignore
      n_bins: 2                     # quantile bins over eligible groups

# Expected export_head_outputs.py rasters (same directory as its output_dir)
# Excluded ("bad") clusters at the matchup step (optional). A record is
# dropped only when its matched area (valid SIT-FUSE cluster pixels that
# overlap valid reference pixels) is entirely in excluded clusters, or the
# whole scene is. Containing an excluded cluster never drops a record: those
# pixels are removed downstream. The stratification positive fraction ignores
# excluded pixels. Share one list with the UQ config (recommended) ...
invalid_clusters:
  from_uq_config: /data/nlahaye/sitfuse_uq/smoke_tempo/uq_config.yaml   # same file passed to simple_classifiers_uq.py
  min_kept_pixels: 1             # drop if fewer non-excluded matched pixels remain
  max_scene_fraction: null       # optional: also drop if the matched-area excluded share exceeds this
  cluster_nodata_values: []      # e.g. [0.0] if .full_geo.tif zero padding should not count as cluster 0
  truth_nodata_values: null      # null = stratify.positive_fraction.nodata_values + raster nodata
  num_child_classes: null        # parent IDs only; null = cluster.heir.num_classes from encoder_split.sit_fuse_yaml (200 for TEMPO)
  geotiff_scale: 1000            # SIT-FUSE cluster GeoTIFFs store joint_label / 1000
# ... or give the list inline (same keys as the UQ config):
# invalid_clusters:
#   joint: [73.201, 48.054]
#   parent: [12]
#   min_kept_pixels: 1
#   num_child_classes: 200

head_outputs:
  directory: /data/nlahaye/output/sitfuse_uq/head_outputs
  suffix: .head_outputs.tif

# Add to the existing `output:` block:
#   split_csv: /data/nlahaye/experiments/hms_context_free/matchup_splits.csv
