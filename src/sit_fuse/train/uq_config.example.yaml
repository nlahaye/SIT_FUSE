# SIT-FUSE hierarchical-head UQ workflow (one config for steps 2-4)
output_dir: /data/nlahaye/output/Learnergy/SF_TEMPO_V04/UQ
random_state: 42

data:
  # Classifier YAML written by the HMS / ADP / FDCC matchup generator with the
  # split section enabled (adds scene_id, head_outputs, split_group,
  # classifier_split, encoder_split, split_stratum, annotation_raster).
  matchup_file:  output_multi_adp_hms_viirs.yaml
  product: smoke
  include_splits: [dev, calibration, holdout]

# Excluded ("bad") clusters: artifact / non-physical clusters only (fill, scan
# edge, striping, glint, bad geolocation). Their pixels are removed from
# features, agreement tables, targets, training, calibration, products
# (nodata + excluded_cluster_mask layer) and evaluation. Ambiguous clusters
# (e.g., thin smoke vs cloud) stay in: excluding them is ambiguity masking.
# The resolved list is part of the feature signature (changing it requires
# retraining). Empty lists = no exclusion.
invalid_clusters:
  joint: [76.49]
  joint_labels: []             # integer joint labels (export_head_outputs.py), e.g. [73201]
  parent: []                   # root-head cluster IDs; all children excluded, e.g. [12]
  geotiff_scale: 1000          # joint_label = round(value * geotiff_scale)
  # Reuse a SIT-FUSE postprocessing context list (context.clusters[index]):
  # from_context_yaml:
  #   path: /home/nlahaye/SIT_FUSE/src/sit_fuse/config/postprocess/tempo_artifacts_geotiff_gen.yaml
  #   index: 0                   # or name: "<context.name entry>"

target:
  classes: [0, 1]            # 0 = background (no smoke), 1 = smoke
  value_map: {0: 0, 1: 1}    # raw reference value -> class index
  unmapped: nodata           # no ambiguity masking; only true NoData is excluded
  nodata_values: [-1, 255]
  annotation_nodata: null    # explicit reference NoData; overrides the raster tag
  # Raster NoData tag vs configured labels (value_map keys):
  #   auto   - ignore the tag when it equals a label (e.g. ADP masks with NoData=0,
  #            where 0 is background); apply it otherwise
  #   use    - always apply the tag;  ignore - never apply it
  # Out-of-extent pixels stay NoData either way. nodata_values / annotation_nodata
  # that equal a label are a configuration error.
  raster_nodata: auto
  # Two assessment levels for "not smoke" (primary = this matchup file's
  # reference, e.g. ADP smoke with positive / negative / NoData):
  #   primary negatives    every primary negative
  #   consensus negatives  primary negatives confirmed by every consensus
  #                        reference (e.g. VIIRS aerosol-type smoke, attached
  #                        with attach_references.py --add viirs_aerosol_smoke=...)
  # Remove or leave consensus_references empty to disable.
  label_levels:
    consensus_references:            # list of names, or {name: target overrides}
      viirs_aerosol_smoke: {value_map: {0: 0, 1: 1}, nodata_values: [255]}
    negative_class: 0
    require_all_observed: true       # consensus needs every consensus reference observed
    consensus_positives: false       # true: tier positives the same way
    training_weights:                # per-level loss weights (1.0 = no change)
      primary_negative: 1.0
      consensus_negative: 1.0
      positive: 1.0
  mode: blended              # reference | cluster_agreement | assignment_ensemble | blended | blended_ensemble
  blend_lambda: 0.5

features:
  groups: [cluster_structure, representation, head_topk_probs, agreement, soft_assignment,
           assignment_ensemble, neighborhood, neighborhood_context]
  # classifier_utils.FeatureBuilder keys (cluster_structure group)
  window_radii: [1, 4]       # windows 3x3 and 9x9
  cross_scale_deltas: true
  hashed_histogram: {enabled: false, n_bins: 64}
  coarse_context_mapping: {}
  neighborhood:              # head-statistic and top-n label features per radius
    top_n_labels: 3
    label_level: joint       # joint | parent
    stats_of: [parent_entropy, child_entropy, parent_maxprob]

context_encoder:
  alpha_parent: 20.0         # shrinkage of A1 toward global prevalence
  alpha_joint: 20.0          # shrinkage of A2 toward parent A1
  inner_oof_folds: 3         # out-of-fold encoding of training rows
  inner_oof_ensemble_members: 20
  assignment:                # set to reproduce the production context assignment
    rule: greedy_agreement   # greedy_agreement | fraction_threshold
    metric: iou              # iou | f1
    tolerance: 0.05          # near-optimal slack used by the ensemble
    threshold: 0.5           # fraction_threshold only
    threshold_grid: [0.3, 0.4, 0.5, 0.6, 0.7]
    min_pixels: 50
    step1_weight: 0.0        # two-step blend with layer-1 (parent) assignment
  assignment_ensemble:
    n_members: 50
    bootstrap_dates: true

sampling:                    # classifier_utils sample_multiclass_by_group + cap_total_samples_stratified
  max_samples_per_class_per_scene: {0: 20000, 1: 20000}
  max_samples: 1500000

split:
  # matchup: holdout / calibration groups from the matchup generator
  # explicit_dates: holdout_dates below; other: classifier_utils.holdout_split
  mode: matchup
  group_column: split_group  # CV folds, encoders, bootstrap resampling and splits
  holdout_dates: []

cross_validation:
  n_splits: 5

models: [logistic_regression, random_forest, hist_gradient_boosting,
         hard_assignment, soft_assignment, assignment_ensemble]

# classifier_utils.build_models blocks; class_weight (default 'balanced') is
# undone by prior correction. oversampling must stay disabled.
oversampling: {enabled: false}
random_forest: {n_estimators: 300, max_depth: 12, min_samples_leaf: 50, max_samples: 0.7}
hist_gradient_boosting: {max_iter: 300, early_stopping: false}
decision_tree: {max_depth: 7, min_samples_leaf: 100}

calibration:
  # calibration_groups: fit calibrators on classifier_split=calibration groups
  # (encoder-test scenes only); cross_fit: on grouped out-of-fold predictions
  mode: calibration_groups
  calibration_dates: []      # optional extra calibration dates
  method: temperature        # temperature | platt | isotonic | none
  prior_correction: true
  target: training_target    # training_target | reference
  # Option A: label level of the calibration rows (also used for thresholds
  # and selective cutoffs). primary = all primary labels (A1); consensus =
  # negatives only where the consensus references confirm them (A2).
  label_level: primary
  # Option C: correct for primary-label noise. T[k][j] = P(primary label j |
  # true class k). 'estimate' compares primary labels with the consensus
  # references on the calibration rows; or give a fixed CxC matrix. Needs
  # target: reference. temperature / platt: forward-corrected fit;
  # isotonic: fit then inverted.
  noise_correction:
    enabled: false
    transition: estimate             # estimate | [[0.97, 0.03], [0.15, 0.85]]
    prior_counts: 1.0                # Dirichlet smoothing per cell (estimate)
    min_diagonal_margin: 0.2         # refuse near-uninformative matrices
  threshold_metric: iou

# Selective discrete product: uncertainty threshold chosen on the calibration
# rows so that retained pixels have error <= target_error (or a fixed coverage)
selective:
  enabled: true
  measure: predictive_entropy          # layer used for pred_label_selective / selective_flag
  measures: [predictive_entropy, margin_uncertainty, ensemble_mutual_information,
             ensemble_total_entropy, assignment_vote_variance]   # all thresholds stored for evaluation
  target_error: 0.05
  target_coverage: null                # set (e.g. 0.9) to fix coverage instead

bootstrap_ensemble:
  enabled: true
  models: [logistic_regression]
  n_models: 10

inference:
  model: random_forest
  # scene_file defaults to data.matchup_file; splits filters classifier_split
  # (null = all scenes, e.g. for unlabeled production runs via a separate scene_file)
  splits: null                         # null = all matched scenes (dev scenes enable shift tests)
  chunk_size: 200000
  ensemble_quantiles: [0.05, 0.95]     # ensemble_p<c>_q05 / _q95 interval layers + area intervals
  reference_mask_areas: true           # also report areas over reference-valid pixels
  cog: false                           # rewrite layers as Cloud-Optimized GeoTIFFs

evaluation:
  models: [random_forest, logistic_regression, hist_gradient_boosting,
           hard_assignment, soft_assignment, assignment_ensemble]
  splits: [holdout]          # evaluate only scenes unseen by encoder, classifier and calibrator
  inference_dir_template: /data/nlahaye/output/Learnergy/SF_TEMPO_V04/UQ/inference/{model}
  max_pixels_per_scene: 300000  # subsample with compensating weights; null = all
  max_excluded_reference_fraction: 0.02   # warn if excluded clusters hold > 2% of reference target pixels
  reference_model: hard_assignment   # paired bootstrap differences vs this model
  bootstrap: {n_resamples: 200, ci_level: 0.9, max_pixels_per_scene: 5000}
  boundary: {tolerance_pixels: [1, 2]}
  objects: {min_object_pixels: 9, min_overlap: 0.1}
  # target overrides per attached reference (attach_references.py names)
  references:
    adp_smoke: {value_map: {0: 0, 1: 1}, nodata_values: [255], raster_nodata: auto}   # ADP NoData=0 tag ignored
  # epistemic tests: uncertainty should be higher on the "out" scenes
  shift_tests:
    - {name: encoder_seen_vs_unseen, column: encoder_split, in: [encoder_train], out: [encoder_test]}
    - {name: classifier_seen_vs_unseen, column: classifier_split, in: [dev], out: [holdout]}
    - {name: summer_vs_winter, column: split_stratum, in: ["park_fire_2024|pos_q1"], out: ["la_fires_2025|pos_q1"]}
  shift_splits: null                 # scenes used for shift tests (null = all inferred)
  shift_pixels_per_scene: 5000
