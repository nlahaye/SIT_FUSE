output_dir: output/training_final
random_state: 42

label_column: label
group_column: pair_id

models:
  - logistic_regression
  - random_forest

split:
  enabled: true
  test_size: 0.2
  group_column: pair_id
  label_column: label

cross_validation:
  n_splits: 5
  grouped: true

bootstrap_ensemble:
  enabled: true
  n_models: 10

features:
  window_radii: [1, 3, 5]
  cross_scale_deltas: true
  cluster_nodata: -9999
  annotation_nodata: -9999

  hashed_histogram:
    enabled: true
    n_bins: 32

  coarse_context_mapping:
    0: [1, 2, 3, 4, 5]
    1: [10, 11, 12, 13]
    2: [20, 21, 22]
    3: [30, 31, 32, 33, 34]

rasters:
  - pair_id: scene_2018_06_01
    cluster_raster: /data/sit_fuse/scene_2018_06_01_clusters.tif
    annotation_raster: /data/annotations/scene_2018_06_01_labels.tif

  - pair_id: scene_2018_06_15
    cluster_raster: /data/sit_fuse/scene_2018_06_15_clusters.tif
    annotation_raster: /data/annotations/scene_2018_06_15_labels.tif

  - pair_id: scene_2018_07_03
    cluster_raster: /data/sit_fuse/scene_2018_07_03_clusters.tif
    annotation_raster: /data/annotations/scene_2018_07_03_labels.tif


