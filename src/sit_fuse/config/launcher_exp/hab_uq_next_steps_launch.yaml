# Local-launcher plan for the next steps on the full 2023-01-01..2026-09-30 run (uq_full_2023_2026_ifcb):
#   (1) year effect: calibration reweighting sweep (year balance / label-shift prevalence) for all PN streams,
#       pDA and Total_Phytoplankton, on the production matchup frames (models and test rows unchanged)
#   (2) pDA: random forest, power-0.75 class weights, prior strength 0.25, threshold rule max_flag_ratio 1.5
#   (3) P. delicatissima: year-grouped interval calibration (worst calibration year reaches 0.9)
#   (4) P. seriata, size-class combination: reported from the existing models (evaluate + combine; no retrain)
#   (5) Total_Phytoplankton: full 2023-2026 product (train, evaluate, infer, fuse, animate), plus a
#       light-microscopy-only variant and a microscopy / IFCB / pier subset evaluation
#   (6) Alexandrium pilot (UQ level, all counts vs microscopy only); no production products
#   then report tables (weighted F1 per sensor / fused / original / most-common-bin, QWK, RPSS, coverage,
#   per-year observed rate vs mean forecast probability).
# HAB YAML: hab_reflectance_geotiff_gen_s_ca_2023_2026_full_CA.yaml (next_steps version: species_run adds
#   Total_Phytoplankton; uq.species.pDA / Pseudo_nitzschia_delicatissima_group overrides; microscopy subset).
# Variant spec: next_steps_variants.yaml (copy both next to the production YAML, path below).
#
#   snapshot ─┬─► train_eval x {Total_Phytoplankton, pDA, delicatissima} ─┬─► infer_fuse x sp x year ─► animate
#             │                                                            ├─► combine ─► points pda ─► maps pda x year ─► charm_animate pda
#             └─► evaluate_only x {seriata, PN total, cDA} ────────────────┼─► subset_eval x sp
#                                                                          ├─► variants ─► sweep x variant x sp ──► compare x token
#                                                                          │             └► pilots x {tphyto_microscopy, alex_all, alex_microscopy} ─► compare_pilots
#                                                                          └──────────────────────────────────────► report_tables (after sweep, pilots, subset_eval)
#   points, maps, subset_eval ─► summary
#
# Order matters for (1): the sweep reuses <uq>/models/matchups_<token>.parquet, which exists for
# Total_Phytoplankton and the retrained pDA / delicatissima only after train_eval. No data pulls: inputs, heads,
# C-HARM and CHL caches from the follow-on fixes run cover 2023-01-01..2026-09-30.
#
#   python -m sit_fuse.local_launcher list   hab_uq_next_steps_launch.yaml
#   python -m sit_fuse.local_launcher run    hab_uq_next_steps_launch.yaml --dry-run
#   systemd-run --user --scope -p MemoryMax=108G -p MemoryHigh=100G -p MemorySwapMax=0 \
#     python -m sit_fuse.local_launcher run hab_uq_next_steps_launch.yaml
#   python -m sit_fuse.local_launcher status hab_uq_next_steps_launch.yaml
# Resume: rerun the same command. Failed jobs: --rerun-failed. One stage: --only 'sweep.*'.
#
# Resource budget (16 cores, 2 GPUs, 181 GB): 9 cores (60 %), ~108 GB (60 %, enforced by the scope above).
# All jobs are CPU-only (gpu: 0); GPU 0 stays listed so the budget matches the other plans.
launcher:
  state_dir: /mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/launch/uq_next_steps
  gpus: [0]
  cpus: 9
  pin_cpus: true
  max_parallel: null
  retries: 1
  nice: 10

vars:
  py: python
  cfg: /home/nlahaye/SIT_FUSE/src/sit_fuse/config/postprocess
  yaml: /home/nlahaye/SIT_FUSE/src/sit_fuse/config/postprocess/hab_reflectance_geotiff_gen_s_ca_2023_2026_full_CA.yaml
  uq: /mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/uq_full_2023_2026_ifcb       # = uq.out_dir
  ns: /mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/followon/next_steps          # = variant out_root
  state: /mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/launch/uq_next_steps
  mod: sit_fuse.pipelines.habs.uq
  fo: sit_fuse.pipelines.habs.followon

jobs:
  # 0) Keep the current evaluation + C-HARM summaries (cp -n: never overwritten).
  - name: snapshot
    cmd: >-
      mkdir -p {uq}/before_nextsteps &&
      cp -rn {uq}/evaluation {uq}/before_nextsteps/ &&
      cp -rn {uq}/models {uq}/before_nextsteps/ &&
      (cp -n {uq}/charm_compare/summary_*.csv {uq}/before_nextsteps/ 2>/dev/null || true)
    cpus: 1
    gpu: 0
    priority: 3
    provides: ["{uq}/before_nextsteps/evaluation"]

  # (2) pDA, (3) delicatissima intervals, (5) Total_Phytoplankton: retrain + evaluate.
  # Evaluation now adds year strata, exceedance mean_p (calibration in the large) and fused test predictions.
  - name: train_eval
    cmd: "{py} -m {mod}.hab_uq_pipeline -y {yaml} --stages train,evaluate --species {sp} -n 4"
    grid:
      sp: [Total_Phytoplankton, pDA, Pseudo_nitzschia_delicatissima_group]
    cpus: 4
    gpu: 0
    priority: 1
    after: [{name: snapshot, on: []}]

  # (4) and baselines for (1): re-evaluate the unchanged models (year strata, fused predictions).
  - name: evaluate_only
    cmd: "{py} -m {mod}.hab_uq_pipeline -y {yaml} --stages evaluate --species {sp} -n 2"
    grid:
      sp: [Pseudo_nitzschia_seriata_group, Pseudo_nitzschia_total, cDA]
    cpus: 2
    gpu: 0
    priority: 1
    after: [{name: snapshot, on: []}]

  # Provenance subsets (oos_piers, non_pier, ifcb, microscopy) for every stream.
  - name: subset_eval
    cmd: "{py} -m {mod}.hab_uq_subset_eval -y {yaml} --species {sp}"
    grid:
      sp: [Pseudo_nitzschia_seriata_group, Pseudo_nitzschia_delicatissima_group, Pseudo_nitzschia_total,
           pDA, cDA, Total_Phytoplankton]
    cpus: 2
    gpu: 0
    after: [{name: train_eval, on: []}, {name: evaluate_only, on: []}]

  # Products for the retrained streams (one-day temporal-filter reset at each 1 Jan window start).
  - name: infer_fuse
    cmd: "{py} -m {mod}.hab_uq_pipeline -y {yaml} --stages infer,fuse --species {sp} --window {win} -n 3"
    grid:
      sp: [Total_Phytoplankton, pDA, Pseudo_nitzschia_delicatissima_group]
      win: ["2023-01-01:2023-12-31", "2024-01-01:2024-12-31", "2025-01-01:2025-12-31", "2026-01-01:2026-09-30"]
    cpus: 3
    gpu: 0
    after: [{name: train_eval, on: [sp]}]

  - name: animate
    cmd: "{py} -m {mod}.hab_uq_pipeline -y {yaml} --stages animate --species Total_Phytoplankton,pDA,Pseudo_nitzschia_delicatissima_group -n 2"
    cpus: 2
    gpu: 0
    after: [{name: infer_fuse, on: []}]

  # (4) size-class combination vs direct total PN (uses the new delicatissima model).
  - name: combine
    cmd: "{py} -m {mod}.hab_charm_compare combine -y {yaml}"
    cpus: 2
    gpu: 0
    after: [{name: train_eval, on: []}, {name: evaluate_only, on: []}]

  # (2) pDA against C-HARM with the new model (C-HARM cache from the follow-on fixes run).
  - name: points
    cmd: "{py} -m {mod}.hab_charm_compare points -y {yaml} --target pda"
    cpus: 2
    gpu: 0
    after: [{name: combine, on: []}, {name: infer_fuse, on: []}]

  - name: maps
    cmd: "{py} -m {mod}.hab_charm_compare maps -y {yaml} --target pda --year {year}"
    grid:
      year: [2023, 2024, 2025, 2026]
    cpus: 1
    gpu: 0
    after: [{name: points, on: []}]

  - name: charm_animate
    cmd: "{py} -m {mod}.hab_charm_animate -y {yaml} --target pda --lead 0 --layout compare,types"
    cpus: 1
    gpu: 0
    after: [{name: maps, on: []}]

  - name: summary
    cmd: "{py} -m {mod}.hab_charm_compare summary -y {yaml}"
    cpus: 1
    gpu: 0
    after: [{name: points, on: []}, {name: maps, on: []}, {name: subset_eval, on: []}]

  # (1), (5), (6): variant YAMLs (after the production retrain so reuse_frame_from finds every frame).
  - name: variants
    cmd: "{py} -m {fo}.variants hab -s {cfg}/next_steps_variants.yaml"
    cpus: 1
    gpu: 0
    priority: 2
    after: [{name: train_eval, on: []}, {name: evaluate_only, on: []}]
    provides: ["{ns}/year_balanced/hab_year_balanced.yaml"]

  # (1) Calibration sweep: train (calibration refit on the reused frame) + evaluate, per variant x species.
  - name: sweep
    cmd: "{py} -m {mod}.hab_uq_pipeline -y {ns}/{v}/hab_{v}.yaml --stages train,evaluate --species {sp} -n 2"
    grid:
      v: [year_balanced, prev_median, year_bal_prev_median, prev_mean]
      sp: [Pseudo_nitzschia_total, Pseudo_nitzschia_seriata_group, Pseudo_nitzschia_delicatissima_group,
           pDA, Total_Phytoplankton]
    cpus: 2
    gpu: 0
    after: [{name: variants, on: []}]

  # (5) microscopy-only Total_Phytoplankton and (6) Alexandrium pilots: new matchups, train + evaluate.
  - name: pilots
    cmd: "{py} -m {mod}.hab_uq_pipeline -y {ns}/{v}/hab_{v}.yaml --stages train,evaluate --species {sp} -n 4"
    cases:
      - {v: tphyto_microscopy, sp: Total_Phytoplankton}
      - {v: alex_all,          sp: Alexandrium_spp}
      - {v: alex_microscopy,   sp: Alexandrium_spp}
    id_keys: [v]
    cpus: 4
    gpu: 0
    after: [{name: variants, on: []}]

  # Paired comparison vs production (same test rows; block bootstrap over split_group), year strata included.
  - name: compare
    cmd: >-
      {py} -m {fo}.variant_compare --baseline baseline --variant baseline={uq}
      --variant year_balanced={ns}/year_balanced/uq --variant prev_median={ns}/prev_median/uq
      --variant year_bal_prev_median={ns}/year_bal_prev_median/uq --variant prev_mean={ns}/prev_mean/uq
      --token {tok} --out {ns}/compare
    grid:
      tok: [pseudo_nitzschia_total_bloom, pseudo_nitzschia_seriata_bloom, pseudo_nitzschia_delicatissima_bloom,
            particulate_domoic_acid, total_phytoplankton]
    cpus: 1
    gpu: 0
    after: [{name: sweep, on: []}]

  - name: compare_pilots
    cmd: >-
      {py} -m {fo}.variant_compare --baseline {base} --variant {base}={bdir} --variant {v}={ns}/{v}/uq
      --token {tok} --out {ns}/compare_pilots --by-site
    cases:
      - {v: tphyto_microscopy, base: production, bdir: /mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/uq_full_2023_2026_ifcb, tok: total_phytoplankton}
      - {v: alex_microscopy,   base: alex_all,   bdir: /mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/followon/next_steps/alex_all/uq, tok: alexandrium_bloom}
    id_keys: [v]
    cpus: 1
    gpu: 0
    after: [{name: pilots, on: []}]

  # Report tables: production + every variant (skill_*.csv, year_calibration_*.csv, subsets_*.csv).
  - name: report_tables
    cmd: >-
      {py} -m {mod}.hab_report_tables --run production={uq}
      --run year_balanced={ns}/year_balanced/uq --run prev_median={ns}/prev_median/uq
      --run year_bal_prev_median={ns}/year_bal_prev_median/uq --run prev_mean={ns}/prev_mean/uq
      --run tphyto_microscopy={ns}/tphyto_microscopy/uq
      --run alex_all={ns}/alex_all/uq --run alex_microscopy={ns}/alex_microscopy/uq
      --out {ns}/report --tag next_steps
    cpus: 1
    gpu: 0
    after: [{name: sweep, on: []}, {name: pilots, on: []}, {name: subset_eval, on: []}]
