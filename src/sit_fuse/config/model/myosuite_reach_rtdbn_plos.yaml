data:
  data_dir: "C:/Users/wafis/Documents/SIT-FUSE-RTRBM/data/reach_fixed_1000" # folder containing episode_0000.npy ... episode_0999.npy
  seq_len: 20
  val_percent: 0.15
  test_percent: 0.15 # same 70/15/15 split convention as TMLR config
  split_seed: 42
  num_loader_workers: 0 # worker processes add spawn/pickle overhead with no I/O
  # parallelism benefit here, since the dataset preloads everything into memory
  fill_value: -999999.0

output:
  out_dir: "experiments/sit_fuse_rtdbn_plos"
  generate_intermediate_output: True

rtdbn:
  model_type: ["variance_gaussian"]
  n_visible: 80 # NOT 78 -- myosuite/gymnasium version drift changed the observation
  # dim for myoArmReachFixed-v0 vs the original 78-dim TMLR dataset. The two datasets
  # are not directly comparable/poolable; treat as distinct environment versions.
  n_hidden: [64]
  gibbs_steps: [1]
  temp: [1.0]

encoder_type: "rtdbn"
encoder:
  training:
    learning_rate: [0.001]
    momentum: [0.0]
    weight_decay: [0.0]
    nesterov_accel: [False]
    warmup_epochs: 15
    batch_size: 32
    epochs: [30]
    accelerator: "gpu"
    devices: 1
    gradient_clip_val: 1.0
    precision: "32"

cluster:
  num_classes: 10
  gauss_noise_stdev: [0.01]
  lambda: 1.0
  training:
    learning_rate: 0.001
    batch_size: 32
    epochs: 30
    accelerator: "gpu"
    devices: 1
    gradient_clip_val: 1.0
    precision: "32"

logger:
  use_wandb: False
