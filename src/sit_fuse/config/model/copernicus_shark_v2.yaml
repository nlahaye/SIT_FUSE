# SIT-FUSE DBN + deep clustering on the v2 CMEMS sharks scenes (NatureNet naturenet.environment.cmems_env).
# Same model settings as copernicus_shark.yaml; data block filled from the generated data block:
#   python -m naturenet.environment.sync_v2_configs sitfuse --model sit_fuse/config/model/copernicus_shark_v2.yaml \
#       --block /data/nlahaye/NatureNet_Env/Copernicus/v2/sharks/sharks_sitfuse_data_block.yaml
# files_train = every train_every_days-th complete scene, files_test = every complete scene (inference).
# Channel order: /data/nlahaye/NatureNet_Env/Copernicus/v2/sharks/sharks_env_meta.json
data:
 tile: False
 num_loader_workers: 10
 val_percent: 0.1
 scale_data: True
 pixel_padding: 1
 number_channels: 0      # filled by sync_v2_configs sitfuse (= len(channels) in the env meta JSON)
 fill_value: -999999.0
 valid_min:  -8000.0
 valid_max: 100000000
 subset_count: 1
 output_subset_count: 10
 reader_type: "zarr_to_numpy"
 reader_kwargs:
  none: "none"
  #mask_shp: "/data/nlahaye/remoteSensing/Lakes/glwd_1.shp"
  #mask_oceans: True
 chan_dim: 0
 delete_chans: []
 transform_default:
  chans: []
  transform: []


 files_train: [
]

 files_test: [
]


scaler:
 name: "standard" 

output:
 out_dir: "/data/nlahaye/output/Learnergy/COP_SHARK_V2/"
 generate_intermediate_output: False
 generate_train_output: True

dbn:
 model_type: ["gaussian_selu", "gaussian_selu"]
 dbn_arch: [2000, 1000] #[250, 500, 2000] #, 2000]
 gibbs_steps: [1,1] #, 7, 7] #, 10] #, 25]
 temp: [1.0, 1.0] #, 1.0, 1.0] ##[0.9, 0.75, 0.5] #, 1.0] #, 0.5] #, 0.5] 
 normalize_learnergy: [False, True]
 batch_normalize: [False, False]

encoder_type: "dbn"
encoder:
 tiled: False
 tune_scaler: False
 subset_training: 2000000
 overwrite_model: False
 training:
  learning_rate: [0.00001, 0.00001]
  momentum: [0.95,0.95]
  weight_decay: [0.0001, 0.0001]
  nesterov_accel: [True, True]
  batch_size: 128
  epochs: [100,30]
  accelerator: "gpu"
  devices: 1
  gradient_clip_val: 0.1
  precision: "16-mixed"
  save_dir: "wandb_encoder"
  stratify_data:
   kmeans: True


logger:
 use_wandb: True
 log_model: True
 log_out_dir: "wandb_dbn"
 project: "SIT-FUSE"

cluster:
 gauss_noise_stdev:  [0.01]
 lambda: 1.0
 num_classes: 800
 training:
  learning_rate: 0.0001
  batch_size: 100
  epochs: 30
  accelerator: "gpu"
  devices: 1
  gradient_clip_val: 0.1
  precision: "16-mixed"
  save_dir: "wandb_full_model"

 heir:
  tiers: 1
  gauss_noise_stdev:  [0.01]
  lambda: 1.0
  num_classes: 5
  training:
   accelerator: "gpu"
   devices: 1
   gradient_clip_val: 0.1
   precision: "16-mixed"
   save_dir: "wandb_dbn_full_model_heir"
   batch_size: 100
   min_samples: 1000
   learning_rate: 0.0001
   batch_size: 1000
   epochs: 30



xai:
  max_samples_per_cluster: 200
  max_windows_per_cluster: 200
  batch_size: 512
  seed: 42
  max_evals: 500






