data:
  data_dir: "C:/Users/wafis/Documents/SIT-FUSE-RTRBM/data/reach_fixed_biased_1000" # episode_0000.npy ... episode_0999.npy
  # Generated with --policy biased (momentum-biased random walk toward
  # reducing reach_err), not pure env.action_space.sample().
  seq_len: 20
  val_percent: 0.15
  test_percent: 0.15
  split_seed: 42
  num_loader_workers: 0 # SFTemporalDataset preloads every sequence into memory,
  # so worker processes add only spawn/pickle overhead with no I/O parallelism benefit.
  fill_value: -999999.0

output:
  out_dir: "experiments/sit_fuse_rtdbn_plos_biased"
  generate_intermediate_output: True

rtdbn:
  model_type: ["variance_gaussian"]
  n_visible: 80 # confirmed by generate_reach_data.py's own n_visible check on this run
  n_hidden: [64]
  gibbs_steps: [1]
  temp: [1.0]

encoder_type: "rtdbn"
encoder:
  training:
    learning_rate: [0.001]
    momentum: [0.0]
    weight_decay: [0.0]
    nesterov_accel: [False]
    warmup_epochs: 15
    batch_size: 32
    epochs: [30]
    # CPU, not GPU: this stage's per-timestep gibbs-sampling loop fires many
    # small sequential CUDA kernels, which Windows' WDDM driver model adds
    # heavy per-launch overhead to -- measured ~4x slower on this machine's
    # GPU (2.69 it/s) than CPU (11.42 it/s). The clustering stage below is a
    # single forward pass per batch, no such loop, and GPU is fine there.
    accelerator: "cpu"
    devices: 1
    gradient_clip_val: 1.0
    precision: "32"

cluster:
  num_classes: 10
  gauss_noise_stdev: [0.01]
  lambda: 3.0 # was 1.0 (IID_loss default) -- fixes IIC cluster-usage
  # collapse by strengthening the marginal-entropy/balance term; a
  # noise_stdev increase was tried instead and rejected (made it worse).
  # Doesn't affect k-means/silhouette on the frozen embeddings.
  training:
    learning_rate: 0.001
    batch_size: 32
    epochs: 30
    accelerator: "gpu"
    devices: 1
    gradient_clip_val: 1.0
    precision: "32"

logger:
  use_wandb: False
