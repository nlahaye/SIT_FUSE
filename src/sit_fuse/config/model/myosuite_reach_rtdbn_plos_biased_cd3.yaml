# Silhouette-vs-N investigation: gibbs_steps CD-1 -> CD-3. Result: no effect (see paper).

data:
  data_dir: "C:/Users/wafis/Documents/SIT-FUSE-RTRBM/data/reach_fixed_biased_1000"
  seq_len: 20
  val_percent: 0.15
  test_percent: 0.15
  split_seed: 42
  num_loader_workers: 0
  fill_value: -999999.0

output:
  out_dir: "experiments/sit_fuse_rtdbn_plos_biased_cd3"
  generate_intermediate_output: True

rtdbn:
  model_type: ["variance_gaussian"]
  n_visible: 80
  n_hidden: [64]
  gibbs_steps: [3] # was 1
  temp: [1.0]

encoder_type: "rtdbn"
encoder:
  training:
    learning_rate: [0.001]
    momentum: [0.0]
    weight_decay: [0.0] # unchanged, to isolate gibbs_steps' effect
    nesterov_accel: [False]
    warmup_epochs: 15
    batch_size: 32
    epochs: [30]
    accelerator: "cpu"
    devices: 1
    gradient_clip_val: 1.0
    precision: "32"

cluster:
  num_classes: 10
  gauss_noise_stdev: [0.01]
  lambda: 3.0
  training:
    learning_rate: 0.001
    batch_size: 32
    epochs: 30
    accelerator: "cpu"
    devices: 1
    gradient_clip_val: 1.0
    precision: "32"

logger:
  use_wandb: False
