# HAB variant spec: encoder sweep, VIIRS (SNPP + JPSS1 + JPSS2) UQ heads, day gap off, leave-one-year-out.
#   python -m sit_fuse.pipelines.habs.followon.variants hab -s encoder_sweep_variants.yaml
# Writes <out_root>/<name>/hab_<name>.yaml, uq.out_dir = <out_root>/<name>/uq.
#   <arm>_rep_y<YEAR>   SIT-FUSE head features of the arm's encoder only (representation)
#   <arm>_env_y<YEAR>   + SST, upwelling, climate indices, discharge, standard L3m products
#   phys_y<YEAR>        environmental + standard products only (physics-only reference, VIIRS sensors)
# Arms: dbn_prod (production weights and heads, no retrain), dbn_seed1, pca, conv_dbn, byol, ijepa, mae, rtdbn.
# Folds: 2023 and 2025, both outside the encoder training window (2024-03-05..2024-10-23); every day of the year is
# test, +-14-day buffer excluded (roles from year_holdout roles on the production date_roles.csv).
# In-situ reference: production combined_augmented table (base YAML).
