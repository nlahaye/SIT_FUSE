# Local-launcher plan, follow-on stream (4): pilots for GOES-18 ABI (4a) and native-resolution PACE OCI (4b).
# Pilot window (both): 2025-02-01..2025-05-31 (120 days). Chosen for the 2025 southern California
# Pseudo-nitzschia / domoic acid event: in combined_augmented it has 598 P. seriata samples (76 >= 1e4 cells/L)
# and 101 pDA samples (20 >= 0.5 ng/mL); 2024-04..07 has no pDA >= 0.5. Encoders, heads and UQ all use this
# window; the UQ uses the production date roles (14-day station blocks, 60/20/20) restricted to it
# (uq.date_windows in pilot_variants.yaml), so test samples are shared across all variants.
#
# 4a GOES-18: clear-sky median composites of ABI CONUS/PACUS L2 CMI C01-C03 (0.47 / 0.64 / 0.86 um) with the
#    ABI clear-sky mask (ACMC BCM) and a C03 cap for residual cloud, glint and land, every 5-min scan 16-23 UTC,
#    0.01 deg (native C01/C03; C02 averaged 2 x 2), roi "ca" (cf. Zheng et al. 2023, RSE 295:113660).
#    One pull writes hourly composites (one directory per UTC hour) and the daily composite. One encoder is
#    trained on all hourly scenes; heads + UQ per input cadence: goes18_daily and goes18_h16 ... goes18_h23.
#    goes_compare: every GOES variant and the production polar-orbiter heads against goes18_daily on shared
#    in-situ samples (pooled over sensors, so a sample counts once per variant).
# 4b PACE: OCI L2 AOP granules gridded to 0.01 deg (~1 km, the OCI native ground sample) daily files. Three
#    PACE-only UQ variants on the same samples: pace_l3m_4km (production 4 km L3m heads), pace_l2g_1km (encoder
#    trained at 1 km on the pilot window) and pace_zs_1km (production 4 km encoder applied to the 1 km inputs).
#    pace_compare: baseline pace_l3m_4km. pilot_compare: GOES daily vs PACE on shared samples (same 1 km grid).
#
#   variants ───────────────────────────────────────────────────────────────────────────────┐
#   goes_geo, goes_composite x month ─► goes_train (GPU) ─► goes_models x hour, goes_model_daily
#     ─► goes_heads x variant ─┴► goes_train_eval x variant x sp ─► goes_compare x sp ─┐
#   pace_geo, pace_l2 x month (pull + grid, raw deleted) ─► pace_train (GPU) ─► pace_zs_model            ├► pilot_compare x sp
#     ─► pace_heads x {l2g_1km, zs_1km} ─► pace_train_eval x variant x sp ─► pace_compare x sp ──────────┘
#   pace_rrs_sync (4 km L3m, baseline heads already exist) ─► pace_train_eval (pace_l3m_4km)
#
# Data pulls (pilot window):
#   goes_composite  s3://noaa-goes18 (anonymous); 96 scans/day (16:00-23:55 UTC, every 5-min CONUS scan) x 4
#                   files (CMIPC C01, C02, C03, ACMC). Only the netCDF chunks covering the roi are range-read
#                   (measured 2025-04-01 18-19 UTC: 24 scans, 290 MB, i.e. ~12 MB per scan vs ~105 MB for whole
#                   files), nothing is stored raw: ~1.2 GB/day, ~140 GB transferred for 120 days; kept ~2 GB
#                   (hourly ~1.7 MB and daily ~3.6 MB per file). ~3.5 s per scan with 4 scan threads.
#   pace_l2         earthaccess PACE_OCI_L2_AOP (latest version), Earthdata login in ~/.netrc; granules
#                   intersecting the roi only, one month at a time, raw deleted after gridding
#                   (V3_2: 301 roi granules on 113 days, mean ~147 MB; ~44 GB transferred)
#   pace_rrs_sync   PACE L3m AOP 4 km, global daily files (~750 MB each; only days missing locally)
#
#   python -m sit_fuse.local_launcher list   hab_followon_goes_pace_launch.yaml
#   python -m sit_fuse.local_launcher run    hab_followon_goes_pace_launch.yaml --dry-run
#   systemd-run --user --scope -p MemoryMax=108G -p MemoryHigh=100G -p MemorySwapMax=0 \
#     python -m sit_fuse.local_launcher run hab_followon_goes_pace_launch.yaml
#   python -m sit_fuse.local_launcher status hab_followon_goes_pace_launch.yaml
# Resume: rerun the same command (composites, gridded days, checkpoints and head outputs are skipped when done).
# GOES only: --only 'goes*' 'variants'. PACE only: --only 'pace*' 'variants'.
#
# Resource budget (16 cores, 2 GPUs, 181 GB): 1 GPU (id 0), 9 cores (60 %), ~108 GB (60 %, enforced by the scope).
# Encoder training takes the whole GPU (gpu 1, 6 cores, GOES and PACE one after another); heads share it (0.5,
# 4 cores). Do not run concurrently with the same-instrument plan (both use GPU 0).
launcher:
  state_dir: /mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/launch/followon_goes_pace
  gpus: [0]
  cpus: 9
  pin_cpus: true
  max_parallel: null
  retries: 1
  nice: 10

vars:
  py: python
  yaml: /home/nlahaye/SIT_FUSE/src/sit_fuse/config/postprocess/hab_reflectance_geotiff_gen_s_ca_2023_2026_full_CA.yaml
  cfg: /home/nlahaye/SIT_FUSE/src/sit_fuse/config/postprocess/followon_pilots
  root: /mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526
  uq: /mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/uq_full_2023_2026_ifcb       # production uq.out_dir
  pil: "{root}/followon/pilots"
  state: /mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/launch/followon_goes_pace
  reflectances: /mnt/data1/REFLECTANCES
  goes_daily: /mnt/data1/REFLECTANCES/GOES18_ABI_DAILY_1KM
  goes_hourly: /mnt/data1/REFLECTANCES/GOES18_ABI_HOURLY_1KM
  win: "2025-02-01:2025-05-31"
  pace_1km: /mnt/data1/REFLECTANCES/PACE_OCI_L2G_1KM
  mod: sit_fuse.pipelines.habs.uq
  habs: sit_fuse.pipelines.habs
  fo: sit_fuse.pipelines.habs.followon

jobs:
  # HAB YAMLs: goes18_daily, goes18_h16..h23, pace_l3m_4km, pace_l2g_1km, pace_zs_1km (pilot_variants.yaml)
  - name: variants
    cmd: "{py} -m {fo}.variants hab -s {cfg}/pilot_variants.yaml"
    cpus: 1
    gpu: 0
    priority: 3

  # ---------------------------------------------------------------- 4a GOES-18
  - name: goes_geo
    cmd: "{py} -m {fo}.goes_ocean geo --out /mnt/data1/goes18_geo_1km.zarr --res 0.01"
    cpus: 1
    gpu: 0
    priority: 3
    creates: ["/mnt/data1/goes18_geo_1km.zarr"]

  # one month per job; hourly (one H?? directory per UTC hour) and daily composites from one pass
  - name: goes_composite
    cmd: >-
      {py} -m {fo}.goes_ocean composite --start {s} --end {e} --out {goes_daily} --hourly-out {goes_hourly}
      --raw /mnt/data1/GOES18_RAW/{month} --hour-start 16 --hour-end 23 --minutes 5
      --min-clear 2 --min-clear-hour 3 --max-nir 0.12 --res 0.01 --threads 2 --scan-threads 4
    cases:
      - {month: "2025-02", s: "2025-02-01", e: "2025-02-28"}
      - {month: "2025-03", s: "2025-03-01", e: "2025-03-31"}
      - {month: "2025-04", s: "2025-04-01", e: "2025-04-30"}
      - {month: "2025-05", s: "2025-05-01", e: "2025-05-31"}
    id_keys: [month]
    cpus: 3
    gpu: 0
    priority: 2

  - name: goes_train
    cmd: >-
      mkdir -p {pil}/goes18_hourly/train_config/model &&
      {py} -m {habs}.hab_training_pipeline -y {cfg}/train_GOES18_ABI.yaml -n 6
    cpus: 6
    gpu: 1
    priority: 2
    after: [{name: goes_geo, on: []}, {name: goes_composite, on: []}]

  # per-hour model YAMLs: the trained file lists restricted to one hour directory (same weights)
  - name: goes_models
    cmd: >-
      {py} -m {fo}.variants model --src {pil}/goes18_hourly/train_config/model/train_model_GOES18_ABI.yaml
      --out {pil}/goes18_{hh}/model/train_model_GOES18_ABI.yaml --keep '/{HH}/'
    cases:
      - {hh: h16, HH: H16}
      - {hh: h17, HH: H17}
      - {hh: h18, HH: H18}
      - {hh: h19, HH: H19}
      - {hh: h20, HH: H20}
      - {hh: h21, HH: H21}
      - {hh: h22, HH: H22}
      - {hh: h23, HH: H23}
    id_keys: [hh]
    cpus: 1
    gpu: 0
    after: [{name: goes_train, on: []}]

  # daily model YAML: one hour's list rewritten to the daily directory; days without that hour are added from
  # disk by inference.extend_input_lists
  - name: goes_model_daily
    cmd: >-
      {py} -m {fo}.variants model --src {pil}/goes18_hourly/train_config/model/train_model_GOES18_ABI.yaml
      --out {pil}/goes18_daily/model/train_model_GOES18_ABI.yaml --keep '/H20/'
      --sub '{goes_hourly}/H20/=>{goes_daily}/'
    cpus: 1
    gpu: 0
    after: [{name: goes_train, on: []}]

  - name: goes_heads
    cmd: >-
      {py} -m {habs}.hab_inference_pipeline -y {pil}/{v}/hab_{v}.yaml --stages heads
      --instruments goes18 --window {win} -n 4
    grid:
      v: [goes18_daily, goes18_h16, goes18_h17, goes18_h18, goes18_h19, goes18_h20, goes18_h21, goes18_h22, goes18_h23]
    cpus: 4
    gpu: 0.5
    priority: 1
    after: [{name: goes_models, on: []}, {name: goes_model_daily, on: []}, {name: variants, on: []}]

  - name: goes_train_eval
    cmd: "{py} -m {mod}.hab_uq_pipeline -y {pil}/{v}/hab_{v}.yaml --stages train,evaluate --species {sp} -n 4"
    grid:
      v: [goes18_daily, goes18_h16, goes18_h17, goes18_h18, goes18_h19, goes18_h20, goes18_h21, goes18_h22, goes18_h23]
      sp: [Pseudo_nitzschia_seriata_group, Pseudo_nitzschia_delicatissima_group, Pseudo_nitzschia_total, pDA]
    cpus: 4
    gpu: 0
    after: [{name: goes_heads, on: [v]}]

  - name: goes_compare
    cmd: >-
      {py} -m {fo}.variant_compare --variant goes18_daily={pil}/goes18_daily/uq --variant production={uq}
      --variant goes18_h16={pil}/goes18_h16/uq --variant goes18_h17={pil}/goes18_h17/uq
      --variant goes18_h18={pil}/goes18_h18/uq --variant goes18_h19={pil}/goes18_h19/uq
      --variant goes18_h20={pil}/goes18_h20/uq --variant goes18_h21={pil}/goes18_h21/uq
      --variant goes18_h22={pil}/goes18_h22/uq --variant goes18_h23={pil}/goes18_h23/uq
      --baseline goes18_daily --token {tok} --out {pil}/compare_goes18 --n-boot 500 --pool-sensors
    cases:
      - {sp: Pseudo_nitzschia_seriata_group,       tok: pseudo_nitzschia_seriata_bloom}
      - {sp: Pseudo_nitzschia_delicatissima_group, tok: pseudo_nitzschia_delicatissima_bloom}
      - {sp: Pseudo_nitzschia_total,               tok: pseudo_nitzschia_total_bloom}
      - {sp: pDA,                                  tok: particulate_domoic_acid}
    id_keys: [tok]
    cpus: 2
    gpu: 0
    after: [{name: goes_train_eval, on: [sp]}]

  # ---------------------------------------------------------------- 4b PACE
  - name: pace_rrs_sync
    cmd: >-
      {py} -m sit_fuse.preprocessing.data_pull.sync_l3m_rrs --start 2025-02-01 --end 2025-05-31
      --dir PACE_OCI={reflectances}/PACE_OCI --res 4km --layout flat --threads 2
      --nrt-archive-dir {reflectances}/nrt_archive/PACE_OCI --report {state}/rrs_sync_PACE_OCI.csv
    cpus: 1
    gpu: 0
    priority: 2

  - name: pace_geo
    cmd: "{py} -m {fo}.pace_l2 geo --out /mnt/data1/pace_l2g_1km_geo.zarr --res 0.01"
    cpus: 1
    gpu: 0
    priority: 3
    creates: ["/mnt/data1/pace_l2g_1km_geo.zarr"]

  # one month per job: pull the roi granules, grid to 0.01 deg, delete the raw granules
  - name: pace_l2
    cmd: >-
      {py} -m {fo}.pace_l2 pull --start {s} --end {e} --raw /mnt/data1/PACE_L2_RAW/{month} --threads 2 &&
      {py} -m {fo}.pace_l2 grid --start {s} --end {e} --raw /mnt/data1/PACE_L2_RAW/{month}
      --out {pace_1km} --res 0.01 --threads 2 --delete-raw
    cases:
      - {month: "2025-02", s: "2025-02-01", e: "2025-02-28"}
      - {month: "2025-03", s: "2025-03-01", e: "2025-03-31"}
      - {month: "2025-04", s: "2025-04-01", e: "2025-04-30"}
      - {month: "2025-05", s: "2025-05-01", e: "2025-05-31"}
    id_keys: [month]
    cpus: 2
    gpu: 0
    priority: 2

  - name: pace_train
    cmd: >-
      mkdir -p {pil}/pace_l2g_1km/train_config/model &&
      {py} -m {habs}.hab_training_pipeline -y {cfg}/train_PACE_OCI_L2G_1km.yaml -n 6
    cpus: 6
    gpu: 1
    priority: 2
    after: [{name: pace_geo, on: []}, {name: pace_l2, on: []}]

  # zero-shot model YAML: 1 km file lists + reader_kwargs from the 1 km training, weights / scaler of the
  # production 4 km PACE encoder
  - name: pace_zs_model
    cmd: >-
      {py} -m {fo}.variants model --src {pil}/pace_l2g_1km/train_config/model/train_model_PACE_OCI.yaml
      --out {pil}/pace_zs_1km/model/train_model_PACE_OCI.yaml
      --out-dir /mnt/data1/HAB_MODEL_WEIGHTS/OC_SIF_HABs_2025//PACE_OCI_no_trop/
    cpus: 1
    gpu: 0
    after: [{name: pace_train, on: []}]

  - name: pace_heads
    cmd: >-
      {py} -m {habs}.hab_inference_pipeline -y {pil}/{v}/hab_{v}.yaml --stages heads
      --instruments pace --window {win} -n 4
    grid:
      v: [pace_l2g_1km, pace_zs_1km]
    cpus: 4
    gpu: 0.5
    priority: 1
    after: [{name: pace_zs_model, on: []}, {name: variants, on: []}]

  - name: pace_train_eval
    cmd: "{py} -m {mod}.hab_uq_pipeline -y {pil}/{v}/hab_{v}.yaml --stages train,evaluate --species {sp} -n 4"
    grid:
      v: [pace_l3m_4km, pace_l2g_1km, pace_zs_1km]
      sp: [Pseudo_nitzschia_seriata_group, Pseudo_nitzschia_delicatissima_group, Pseudo_nitzschia_total, pDA]
    cpus: 4
    gpu: 0
    after: [{name: pace_heads, on: [v]}, {name: pace_rrs_sync, on: []}, {name: variants, on: []}]

  - name: pace_compare
    cmd: >-
      {py} -m {fo}.variant_compare --variant pace_l3m_4km={pil}/pace_l3m_4km/uq
      --variant pace_l2g_1km={pil}/pace_l2g_1km/uq --variant pace_zs_1km={pil}/pace_zs_1km/uq
      --baseline pace_l3m_4km --token {tok} --out {pil}/compare_pace --n-boot 500 --by-site
    cases:
      - {sp: Pseudo_nitzschia_seriata_group,       tok: pseudo_nitzschia_seriata_bloom}
      - {sp: Pseudo_nitzschia_delicatissima_group, tok: pseudo_nitzschia_delicatissima_bloom}
      - {sp: Pseudo_nitzschia_total,               tok: pseudo_nitzschia_total_bloom}
      - {sp: pDA,                                  tok: particulate_domoic_acid}
    id_keys: [tok]
    cpus: 2
    gpu: 0
    after: [{name: pace_train_eval, on: [sp]}]

  # GOES daily vs PACE (4 km and 1 km) on shared samples; GOES 1 km and PACE 1 km use the same grid
  - name: pilot_compare
    cmd: >-
      {py} -m {fo}.variant_compare --variant pace_l3m_4km={pil}/pace_l3m_4km/uq
      --variant pace_l2g_1km={pil}/pace_l2g_1km/uq --variant goes18_daily={pil}/goes18_daily/uq
      --baseline pace_l3m_4km --token {tok} --out {pil}/compare_goes_pace --n-boot 500 --pool-sensors
    cases:
      - {sp: Pseudo_nitzschia_seriata_group,       tok: pseudo_nitzschia_seriata_bloom}
      - {sp: Pseudo_nitzschia_delicatissima_group, tok: pseudo_nitzschia_delicatissima_bloom}
      - {sp: Pseudo_nitzschia_total,               tok: pseudo_nitzschia_total_bloom}
      - {sp: pDA,                                  tok: particulate_domoic_acid}
    id_keys: [tok]
    cpus: 2
    gpu: 0
    after: [{name: goes_train_eval, on: [sp]}, {name: pace_train_eval, on: [sp]}]
