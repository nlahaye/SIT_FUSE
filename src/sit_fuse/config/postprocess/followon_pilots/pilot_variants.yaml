                                       model_dir: /mnt/data1/HAB_MODEL_WEIGHTS/FOLLOWON/GOES18_ABI_1KM_HOURLY/GOES18_ABI_no_trop/}}}
      inference: {model_configs: {goes18: {no_trop: /mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/followon/pilots/goes18_h17/model/train_model_GOES18_ABI.yaml}}}
