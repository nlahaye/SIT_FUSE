      head_export: {georef: {final_resolution: 0.01, resample_radius: 1500}}

  # PACE baseline: production 4 km L3m heads, PACE-only UQ heads
  pace_l3m_4km:
    sensors: [pace]

  # PACE gridded L2 at 1 km, encoder retrained at 1 km (train_PACE_OCI_L2G_1km.yaml)
  pace_l2g_1km:
    sensors: [pace]
    set:
      uq.context_encoder.spatial_tier.enabled: false
      uq.features.window_radii: [4, 8, 16]
      geo_zarr: /mnt/data1/pace_l2g_1km_geo.zarr
    overrides:
      instruments:
        pace:
          no_trop:
            out_dir: /mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/followon/pilots/pace_l2g_1km/products/PACE_OCI_no_trop/
            model_dir: /mnt/data1/HAB_MODEL_WEIGHTS/FOLLOWON/PACE_OCI_1KM/PACE_OCI_no_trop/
      inference:
        model_configs:
          pace: {no_trop: /mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/followon/pilots/pace_l2g_1km/train_config/model/train_model_PACE_OCI.yaml}
      head_export:
        georef: {final_resolution: 0.01, resample_radius: 1500}

  # PACE gridded L2 at 1 km, production 4 km encoder applied unchanged (zero-shot resolution transfer).
  # Model YAML = the 1 km training YAML (1 km file lists + reader_kwargs) with output.out_dir -> 4 km weights
  # (written by the launcher job pace_zs_model with variants model).
  pace_zs_1km:
    sensors: [pace]
    set:
      uq.context_encoder.spatial_tier.enabled: false
      uq.features.window_radii: [4, 8, 16]
      geo_zarr: /mnt/data1/pace_l2g_1km_geo.zarr
    overrides:
      instruments:
        pace:
          no_trop:
            out_dir: /mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/followon/pilots/pace_zs_1km/products/PACE_OCI_no_trop/
            model_dir: /mnt/data1/HAB_MODEL_WEIGHTS/OC_SIF_HABs_2025//PACE_OCI_no_trop/
      inference:
        model_configs:
          pace: {no_trop: /mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/followon/pilots/pace_zs_1km/model/train_model_PACE_OCI.yaml}
      head_export:
        georef: {final_resolution: 0.01, resample_radius: 1500}
