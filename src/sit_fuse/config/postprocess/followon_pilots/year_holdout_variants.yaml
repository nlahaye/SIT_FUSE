# HAB variant spec: held-out-year and no-day-gap checks (follow-on 1 robustness).
#   python -m sit_fuse.pipelines.habs.followon.variants hab -s year_holdout_variants.yaml
# Writes <out_root>/<name>/hab_<name>.yaml, uq.out_dir = <out_root>/<name>/uq.
#   prod_nogap_interleaved   production features and production (interleaved) split, day gap off;
#                            paired with the production run: effect of the day gap alone
#   <v>_y<YEAR>              leave-one-year-out fold: every day of YEAR is test (roles_y<YEAR>.csv from
#                            year_holdout roles), +-14-day buffer excluded, other days keep production roles
#     prod                   production features, day gap on (reference)
#     prod_nogap             production features, day gap off
#     anc_sst_nogap          + MUR SST
#     anc_phys_nogap         + SST, upwelling, climate indices, discharge, standard L3m products
#     phys_nogap             environmental + standard products only (sensor columns kept)
#     phys_nogap_nosensor    as phys_nogap, sensor indicator columns dropped
base_yaml: /home/nlahaye/SIT_FUSE/src/sit_fuse/config/postprocess/hab_reflectance_geotiff_gen_s_ca_2023_2026_full_CA.yaml
out_root: /mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/followon/year_holdout
