

start_lon: -128.00
end_lon: -116.00
start_lat: 30.00
end_lat: 38.94

geo_zarr:
 oc_geo_fpattern: "/mnt/data1/cal_coast_geo.zarr" #TODO
 out_dir: "/mnt/data1/"
 out_uid: "cal_coast_geo"

sif_dir: "/mnt/data1/TROPOSIF/"
train_min_date: "20240305"
train_max_date: "20241023"

# Spatio-temporally stratified day split (sit_fuse.datasets.scene_split via
# pipelines/habs/hab_scene_split.py), shared by all sensors. Context assignment
# uses train days, validation uses held-out (test) days, uq.splits follows the
# same days. The manifest is reused once written; keep it shared with the
# training and _val configs so every stage sees the identical split.
scene_split:
  enabled: false           # set true to replace the train_min_date/train_max_date window
  manifest: "/mnt/data1/HAB_COMBINED_2024_2025_SPLIT/scene_split/hab_ca_2024_2025_scene_split.csv"
  regenerate: false
  dates_from: auto           # inputs (input_oc_dir) when present, else inference out_dir
  date_range: null          # all input days; train_min_date/train_max_date are not used with the split
  strata:
    time_bins: [season_year]
  split:
    block_days: 14
    test_fraction: 0.2
    val_fraction: 0.0        # > 0 gives UQ calibration days unseen by context assignment
    buffer_days: 3
    balance: proportional
    min_units_for_test: 2
    seed: 0
  output:
    dir: "/mnt/data1/HAB_COMBINED_2024_2025_SPLIT/scene_split/"
    tag: hab_ca_2024_2025
  context_splits: [train]
  validation_splits: [test]
  uq: true
  files_test: rest           # training: inference covers files_train + files_test = all days
  sampling:
    scene_balance: 0.5
    spatial_block: 32
    spatial_balance: 0.5
    seed: 0

roi: "ca"
#output: "/mnt/data1/HAB_MODEL_WEIGHTS/OC_SIF_HABs_2025/JPSS2_VIIRS/"

config_dir: "/home/nlahaye/SIT_FUSE/src/sit_fuse/config/"

output: "/mnt/data1/HAB_MODEL_WEIGHTS/OC_SIF_HABs_2025/"

instruments:
 PACE_OCI:
  no_trop:
      run_preprocess_and_scale: False
      input_dir: "/mnt/data1/REFLECTANCES/PACE_OCI/"
      output_dir: "/mnt/data1/HAB_MODEL_WEIGHTS/OC_SIF_HABs_2025/"
      input_pattern: "PACE_OCI*nc"
      input_clip_re: "RRS.*nc"
      input_oc_dir: "/mnt/data1/REFLECTANCES/PACE_OCI/"
      input_oc_re: '(PACE_OCI\.(\d{8})\.L3m\.DAY\.)AOP.*\.4km.*nc' #PACE_OCI.20241111.L3m.DAY.AOP.V3_2.4km.nc


 # SNPP + JPSS1 + JPSS2 VIIRS: one model, 5 channels. SNPP 410/443/486/551/671 nm and
 # NOAA-20/21 411/445/489/556/667 nm share channel positions (offsets <= 5 nm).
 VIIRS:
  no_trop:
   input_oc_dir: ["/mnt/data1/REFLECTANCES/SNPP_VIIRS/", "/mnt/data1/REFLECTANCES/JPSS1_VIIRS/", "/mnt/data1/REFLECTANCES/JPSS2_VIIRS/"]
   input_dir: ["/mnt/data1/REFLECTANCES/SNPP_VIIRS/", "/mnt/data1/REFLECTANCES/JPSS1_VIIRS/", "/mnt/data1/REFLECTANCES/JPSS2_VIIRS/"]
   input_oc_re:  '((?:SNPP|JPSS1|JPSS2)_VIIRS\.(\d{8})\.L3m\.DAY\.)RRS.*\.4km.*nc'
   # a list of regexes, one per directory, is also accepted
   run_preprocess_and_scale: False
   output_dir: "/mnt/data1/HAB_MODEL_WEIGHTS/OC_SIF_HABs_2025/"
   input_pattern: "VIIRS*nc"
   input_clip_re: "RRS.*nc"

 AQUA_MODIS:
  no_trop:
      run_preprocess_and_scale: False
      input_dir: "/mnt/data1/REFLECTANCES/AQUA_MODIS/"
      output_dir: "/mnt/data1/HAB_MODEL_WEIGHTS/OC_SIF_HABs_2025/"
      input_pattern: "AQUA_MODIS*nc"
      input_clip_re: "RRS.*nc"
      input_oc_dir: "/mnt/data1/REFLECTANCES/AQUA_MODIS/"
      input_oc_re: '(AQUA_MODIS\.(\d{8})\.L3m\.DAY\.)RRS.*\.4km.*nc'

 # S3A + S3B OLCI: one model, one scaler, 11 channels (identical band sets)
 OLCI:
  no_trop:
   input_oc_dir: ["/mnt/data1/REFLECTANCES/S3A_OLCI/", "/mnt/data1/REFLECTANCES/S3B_OLCI/"]
   input_oc_re:  '((?:S3A|S3B)_OLCI_ERRNT\.(\d{8})\.L3m\.DAY\.)RRS.*\.4km.*nc'
   input_dir: ["/mnt/data1/REFLECTANCES/S3A_OLCI/", "/mnt/data1/REFLECTANCES/S3B_OLCI/"]
   run_preprocess_and_scale: False
   output_dir: "/mnt/data1/HAB_MODEL_WEIGHTS/OC_SIF_HABs_2025/"
   input_pattern: "S3*_OLCI*nc"
   input_clip_re: "RRS.*nc"






