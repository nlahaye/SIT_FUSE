# HAB UQ / probabilistic products. Same keys as
# hab_reflectance_geotiff_gen_s_ca_2024_multi_sensor_test.yaml plus the `uq:` block.
# Run: python -m sit_fuse.pipelines.habs.uq.hab_uq_pipeline -y <this file>
# or set run_uq: true and call hab_post_inference_pipeline.py.

reuse_context: False
prob: True                 # also write .proba.tif (used as head confidence in label_only mode)
no_heir: True
config_dir: "/home/nlahaye/SIT_FUSE/src/sit_fuse/config/"
geo_zarr: "/mnt/data1/cal_coast_geo.zarr"
insitu_file: "/mnt/data1/la_hab_data/combined_full.csv"
insitu_matchup_circle_max_radius: [0.09]
start_date: "2024-01-01"
end_date: "2025-04-01"
clusters: 120000
roi: "california"
final_product_dir: "/mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_062526/"
run_uq: true

instruments:
  pace:  {no_trop: {out_dir: "/mnt/data1/HAB_COMBINED_RUNS/PACE_OCI_no_trop/"}}
  s3a:   {no_trop: {out_dir: "/mnt/data1/HAB_COMBINED_RUNS/S3A_OLCI_no_trop/"}}
  s3b:   {no_trop: {out_dir: "/mnt/data1/HAB_COMBINED_RUNS/S3B_OLCI_no_trop/"}}
  jpss1: {no_trop: {out_dir: "/mnt/data1/HAB_COMBINED_RUNS/JPSS1_VIIRS_no_trop/"}}
  jpss2: {no_trop: {out_dir: "/mnt/data1/HAB_COMBINED_RUNS/JPSS2_VIIRS_no_trop/"}}
  modis: {no_trop: {out_dir: "/mnt/data1/HAB_COMBINED_RUNS/AQUA_MODIS_no_trop/"}}
  snpp:  {no_trop: {out_dir: "/mnt/data1/HAB_COMBINED_RUNS/SNPP_VIIRS_no_trop/"}}

uq:
  out_dir: "/mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_062526/uq/"
  # augmented in-situ table written by sit_fuse.pipelines.habs.insitu.pull_insitu_hab
  insitu_file: "/mnt/data1/la_hab_data/combined_full_augmented.csv"
  start_date: "2024-01-01"
  end_date: "2025-04-01"
  max_depth_m: 1.0
  num_child: 100             # model YAML cluster.heir.num_classes (joint = child + num_child*parent)
  input_mode: auto           # auto | head_outputs | label_only
  label_level: heir          # heir | no_heir (label_only mode)
  no_heir_value: parent
  use_proba: true
  radius_degrees: 0.09       # production SoCal radius
  max_day_offset: 1          # 0 = production same-day; 1 adds +/-1 d rows with temporal weights
  encoder_use_offset_days: false
  temporal_weighting: {tau_days: 1.5, sigma_hours: 6.0}
  count_mode: unique_per_sample
  sensors: [pace, s3a, s3b, jpss1, jpss2, modis, snpp]
  model_scope: pooled        # pooled (sensor one-hot, class-space features) | per_sensor
  seed: 42

  splits:
    block: "30D"
    group_by: [station, block]
    fractions: {train: 0.6, calibration: 0.2, test: 0.2}
    # test_years: [2025]     # temporal holdout alternative
    n_folds: 5
    seed: 13

  features:
    window_radii: [1, 2, 4]
    neighborhood: {top_n_labels: 3, label_level: joint,
                   stats_of: [parent_entropy, child_entropy, parent_maxprob]}
    groups: [cluster_structure, representation, head_topk_probs, agreement,
             soft_assignment, assignment_ensemble, neighborhood, neighborhood_context]
    use_day_offset: true

  context_encoder:
    alpha_parent: 5.0
    alpha_joint: 5.0
    assignment: {rule: histogram_mode, min_samples: 1, replicate_production_offset: false}
    assignment_ensemble: {n_members: 100, bootstrap_unit: split_group}

  target:
    mode: blended_ensemble   # reference | cluster_agreement | assignment_ensemble | blended | blended_ensemble
    reference: measurement   # measurement (log-normal soft labels) | onehot
    blend_lambda: 0.3

  classifier:
    model: auto              # auto | encoder_only | hist_gradient_boosting | random_forest (auto = lowest calibration-set RPS)
    candidates: [encoder_only, hist_gradient_boosting, random_forest]
    random_forest: {n_estimators: 300, max_depth: 8, min_samples_leaf: 5, min_samples_split: 10,
                    class_weight: balanced_subsample, max_samples: 0.7}
    n_bootstrap_members: 0   # >0: group-bootstrap refits (use for non-forest models)
  max_members: 100

  calibration: {method: temperature, prior_correction: true, min_samples: 30}
  selective: {target_coverage: 0.8, bin_tolerance: 0}

  species:                   # optional overrides of hab_uq_common.DEFAULT_SPECIES
    pDA: {alert_thresholds: [0.5, 1.0], measurement_sigma_dex: 0.15}
    Pseudo_nitzschia_seriata_group: {alert_thresholds: [10000, 100000]}

  evaluation: {n_bootstrap: 500}

  fusion:
    pool: log                # linear | log | poe
    ref_local_hour: 10.0     # pier sampling ~09-10 local
    tau_hours: 4.0
    quality: selective       # none | selective | entropy
    temporal_filter: true
    transition_stay: 0.7
