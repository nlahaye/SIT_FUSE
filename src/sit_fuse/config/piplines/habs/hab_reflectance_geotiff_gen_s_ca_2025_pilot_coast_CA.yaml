# PILOT (relaxed coastal masking): same window, species and day roles as
# hab_reflectance_geotiff_gen_s_ca_2025_pilot_CA.yaml, plus
#   - head outputs re-exported for the pilot window into separate product dirs
#     (instruments.*.out_dir) with the trained models read from model_dir;
#   - inference.data_overrides: Natural Earth 1:10m land mask instead of 1:50m
#     ocean basins, and edge-filled 3x3 windows for coastal / cloud-edge pixels;
#   - uq.out_dir uq_pilot_coast, calibration prior_correction_strength 0.
# Run: hab_inference_pipeline --stages heads, then hab_uq_pipeline --stages train,evaluate
# Pier-only scores without retraining: hab_uq_subset_eval -y <this yaml> (uq.evaluation.subsets)
# If the pilot evaluation holds up: hab_uq_pipeline --stages infer,fuse,animate
#   (per-sensor *.uq.tif -> fused/ -> animations/; uq.animation below)
# IFCB run (uq_pilot_coast_ifcbw_clean): all sources, IFCB Pseudo-nitzschia chain ROIs converted to
#   cells (insitu_sources pn_chain_correction) and IFCB down-weighted per site-day
#   (uq.sample_weighting). Table insitu_augmented_clean/: ingestion cleaning (insitu_sources
#   `cleaning:`) merges repeated combined_full rows of one sample, sets negative concentrations
#   to NaN and drops samples deeper than 1 m; ERDDAP/CalCOFI units are checked on pull.
#   Re-ingest (ERDDAP + CalCOFI re-pulled, IFCB from cache):
#   python -m sit_fuse.pipelines.habs.insitu.pull_insitu_hab -y insitu_sources.example.yaml \
#     --ifcb-cache-only --no-coverage --out-dir /mnt/data1/habs/insitu_augmented_clean
#   If ERDDAP is unreachable, rebuild from the previous table instead (cleaning still applied,
#   no unit re-check of the cached pier/CalCOFI rows):
#   python -m sit_fuse.pipelines.habs.insitu.pull_insitu_hab -y insitu_sources.example.yaml \
#     --only ifcb_dashboard --ifcb-cache-only --no-coverage \
#     --existing /mnt/data1/habs/insitu_augmented/combined_augmented.csv \
#     --out-dir /mnt/data1/habs/insitu_augmented_clean
#   then hab_uq_pipeline --stages train,evaluate
# WINDOWS run (uq_pilot_coast_windows_piers): three date windows (uq.date_windows) chosen for
#   pDA and Pseudo-nitzschia spread inside the existing 2024-03..2025-12 inference span:
#   B 2024-05-01..06-30 (high P. delicatissima, pDA < 0.1), A + pilot 2024-12-01..2025-06-15,
#   C 2025-07-15..08-31 (summer pDA 0.1-1.8 ng/mL). Full California domain. IFCB rows are
#   excluded (uq.insitu_filter exclude_methods: [ifcb]); piers only (combined_full + ERDDAP).
#   1) day roles for the windows (seed search spreads alert events over calibration/test):
#      python -m sit_fuse.pipelines.habs.uq.hab_uq_pilot_plan -y <this yaml> --mode resplit \
#        --seed-search 50 --out /mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/uq_pilot_windows/pilot_date_roles.csv
#   2) head outputs for the new window days (pilot days already exported are skipped):
#      hab_inference_pipeline --stages heads   (inference.date_windows)
#   3) hab_uq_pipeline --stages train,evaluate   [then infer,fuse,animate: fusion and
#      animations run per window]
#   Parallel (local launcher): steps 1-3 plus infer,fuse,animate as one plan, sharded per instrument x
#   window (heads), species (train,evaluate) and species x window (infer,fuse):
#      python -m sit_fuse.local_launcher run hab_uq_pilot_coast_windows_launch.yaml [--cpus 24]
#   (CLI equivalents: hab_inference_pipeline --instruments pace --window 2024-05-01:2024-06-30;
#    hab_uq_pipeline --species pDA [--window START:END for infer / fuse only])

reuse_context: False #True

run_uq: true

prob: True
no_heir: True
config_dir: "/home/nlahaye/SIT_FUSE/src/sit_fuse/config/"
geo_zarr: "/mnt/data1/cal_coast_geo.zarr"
 
insitu_file: "/mnt/data1/habs/insitu_augmented_clean/combined_augmented_strict.csv" # was insitu_augmented_chain/, insitu_augmented/ #/mnt/data1/la_hab_data/combined_full_071426.csv" #HAB_S_CA_Combined.csv" #combined_full.csv"
#/mnt/data1/habs/insitu_augmented_v2/combined_augmented_strict.csv 
insitu_matchup_circle_max_radius: [0.09]
start_date: "2024-03-01" #"2024-07-01" #"2018-10-01"
end_date: "2025-12-01" #"2025-12-31" #"2025-07-01" #"2025-12-31"
clusters: 120000

roi: "california"

final_product_dir: "/mnt/data1/HAB_COMBINED_2024_2025_SPLIT/MERGED_TEST_1115_26/"

# Spatio-temporally stratified day split (sit_fuse.datasets.scene_split via
# pipelines/habs/hab_scene_split.py), shared by all sensors. Context assignment
# uses train days, validation uses held-out (test) days, uq.splits follows the
# same days. The manifest is reused once written; keep it shared with the
# training and _val configs so every stage sees the identical split.
scene_split:
  enabled: true
  manifest: "/mnt/data1/HAB_COMBINED_2024_2025_SPLIT/scene_split/hab_ca_2024_2025_scene_split.csv"
  regenerate: false
  dates_from: auto           # inputs (input_oc_dir) when present, else inference out_dir
  date_range: ["2024-01-01", "2026-10-01"]   # covers uq start/end; context/validation also clip to start_date/end_date
  strata:
    time_bins: [season_year]
  split:
    block_days: 14
    test_fraction: 0.2
    val_fraction: 0.0        # > 0 gives UQ calibration days unseen by context assignment
    buffer_days: 3
    balance: proportional
    min_units_for_test: 2
    seed: 0
  output:
    dir: "/mnt/data1/HAB_COMBINED_2024_2025_SPLIT/scene_split/"
    tag: hab_ca_2024_2025
  context_splits: [train]
  validation_splits: [test]
  uq: true
  files_test: rest           # training: inference covers files_train + files_test = all days
  sampling:
    scene_balance: 0.5
    spatial_block: 32
    spatial_balance: 0.5
    seed: 0


 
instruments: 
 pace:
   no_trop: 
      "out_dir": "/mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/pilot_coast_products/PACE_OCI_no_trop/"      # pilot head outputs
      "model_dir": "/mnt/data1/HAB_MODEL_WEIGHTS/OC_SIF_HABs_2025//PACE_OCI_no_trop/"    # trained model + scaler (unchanged)
 olci: 
  no_trop:  
      "out_dir": "/mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/pilot_coast_products/OLCI_no_trop/"      # pilot head outputs
      "model_dir": "/mnt/data1/HAB_MODEL_WEIGHTS/OC_SIF_HABs_2025//OLCI_no_trop/"    # trained model + scaler (unchanged)
 viirs:
  no_trop:  
      "out_dir": "/mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/pilot_coast_products/VIIRS_no_trop/"      # pilot head outputs
      "model_dir": "/mnt/data1/HAB_MODEL_WEIGHTS/OC_SIF_HABs_2025//VIIRS_no_trop/"    # trained model + scaler (unchanged)
 modis:
  no_trop:  
      "out_dir": "/mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/pilot_coast_products/AQUA_MODIS_no_trop/"      # pilot head outputs
      "model_dir": "/mnt/data1/HAB_MODEL_WEIGHTS/OC_SIF_HABs_2025//AQUA_MODIS_no_trop/"    # trained model + scaler (unchanged)
 #troposif: No SIF data for 2024-2025 cases
 #goes18:  
 # no_trop: 
 #'     "out_dir": "/data1/nlahaye/output/Learnergy/GOES18_ABI_ONLY_S_CA/"


run_resample: True

validation_only: False

uq:
  input_mode: head_outputs 
  out_dir: "/mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/uq_pilot_coast_windows_piers/"   # was uq_pilot_coast_ifcbw_clean/, uq_pilot_coast_ifcbw/, uq_pilot_coast/
  # augmented in-situ table written by sit_fuse.pipelines.habs.insitu.pull_insitu_hab
  # non-strict (source/method columns): required by sample_weighting and insitu_filter
  insitu_file: "/mnt/data1/habs/insitu_augmented_clean/combined_augmented.csv" # was insitu_augmented_chain/
  # Date windows (inclusive); replace start_date/end_date in every UQ stage (in-situ load,
  # day roles, inference, fusion, animation). Must match the roles file below.
  date_windows: &pilot_windows
    - ["2024-05-01", "2024-06-30"]   # B: high P. delicatissima, pDA < 0.1 (cells without toxin)
    - ["2024-12-01", "2025-06-15"]   # A (winter pDA, Jan PN) + first pilot window 2025-01-15..06-15
    - ["2025-07-15", "2025-08-31"]   # C: summer pDA 0.1-1.8 ng/mL
  start_date: &pilot_start "2024-05-01"   # overall bounds of date_windows (was 2025-01-15)
  end_date: &pilot_end "2025-08-31"       # (was 2025-06-15)
  species_run: [Pseudo_nitzschia_seriata_group, Pseudo_nitzschia_delicatissima_group, pDA]
  max_depth_m: 1.0           # also enforced at ingestion (insitu_sources cleaning.max_depth_m)
  # Train AND evaluate on one provenance only (rerun from --stages train; needs the
  # non-strict insitu_file). e.g. oos_piers, or {sources: [...], methods: [...], location_codes: [...]}
  # insitu_filter: oos_piers
  insitu_filter: {exclude_methods: [ifcb]}   # IFCB left out for now (piers: combined_full + ERDDAP)
  # Down-weight high-cadence IFCB per site-day: each IFCB (station, week) carries total weight
  # block_weight, split over its site-days (and same-day replicates), so a near-daily IFCB week
  # counts like one weekly pier sample. Train + calibration only; test scoring unchanged.
  sample_weighting:
    enabled: false           # was true; no IFCB rows with insitu_filter above
    methods: [ifcb]
    period: W                # W = site-week budget; D = only split same-day replicates
    block_weight: 1.0        # raise (e.g. 2-3) to give IFCB more total weight than the piers
    splits: [train, calibration]
  num_child: 100             # model YAML cluster.heir.num_classes (joint = child + num_child*parent)
  #input_mode: auto           # auto | head_outputs | label_only
  label_level: heir          # heir | no_heir (label_only mode)
  no_heir_value: parent
  use_proba: true
  radius_degrees: 0.09       # production SoCal radius
  radius_km: 10              # great-circle radius; overrides radius_degrees
  nearest_fallback:          # samples with no valid pixel within radius_km (coastal mask, piers)
    enabled: true
    max_km: 20               # search limit for the nearest valid pixels
    k: 3                     # number of nearest valid pixels used
    decay_km: 5              # sample weight *= exp(-(d_nearest - radius_km) / decay_km)
    use_in_encoder: false    # keep fallback rows out of the cluster->class lookup counts
  max_day_offset: 1          # 0 = production same-day; 1 adds +/-1 d rows with temporal weights
  encoder_use_offset_days: false
  temporal_weighting: {tau_days: 1.5, sigma_hours: 6.0}
  count_mode: unique_per_sample
  sensors: [pace, s3a, s3b, jpss1, jpss2, modis, snpp] #[pace, olci, viirs, modis]
  model_scope: pooled        # pooled (sensor one-hot, class-space features) | per_sensor
  seed: 42

  splits:
    # resplit mode: day roles written by hab_uq_pilot_plan --mode resplit (overrides scene_split days).
    # Comment out to keep the scene-split (encoder/context-held-out) test days instead.
    date_roles_file: "/mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/uq_pilot_windows/pilot_date_roles.csv"   # was uq_pilot/; written by hab_uq_pilot_plan (header step 1)
    block: "14D"             # was 30D; more station x block groups in a short window
    group_by: [station, block]
    fractions: {train: 0.6, calibration: 0.2, test: 0.2}
    # test_years: [2025]     # temporal holdout alternative
    n_folds: 5
    seed: 13

  features:
    window_radii: [1, 2, 4]
    neighborhood: {top_n_labels: 3, label_level: joint,
                   stats_of: [parent_entropy, child_entropy, parent_maxprob]}
    groups: [cluster_structure, representation, head_topk_probs, agreement,
             soft_assignment, assignment_ensemble, neighborhood, neighborhood_context]
    use_day_offset: true

  context_encoder:
    alpha_parent: 5.0
    alpha_joint: 5.0
    assignment: {rule: histogram_mode, min_samples: 1, replicate_production_offset: false}
    assignment_ensemble: {n_members: 30, bootstrap_unit: split_group}   # was 100 (pilot)

  target:
    mode: blended_ensemble   # reference | cluster_agreement | assignment_ensemble | blended | blended_ensemble
    reference: measurement   # measurement (log-normal soft labels) | onehot
    blend_lambda: 0.1        # was 0.3; less pull toward the majority-bin cluster lookup

  classifier:
    model: random_forest     # was auto; auto picks by calibration RPS on ~7 pDA alert events (noisy)
    candidates: [hist_gradient_boosting, random_forest]   # was [encoder_only, ...]; encoder_only cannot use class weights
    class_weighting: {mode: sqrt_inverse, max_weight: 10}  # none | sqrt_inverse | inverse
    random_forest: {n_estimators: 300, max_depth: 8, min_samples_leaf: 15, min_samples_split: 30,   # was 5 / 10: no leaf from one bloom day
                    class_weight: null, max_samples: 0.7}   # was balanced_subsample; class_weighting replaces it
    n_bootstrap_members: 20  # was 0; refits on station x block bootstrap draws (spread reflects event-day dependence)
  max_members: 30            # was 100 (pilot)

  calibration: {method: temperature, prior_correction: true, prior_correction_strength: 0.0,   # was 0.5
                min_samples: 30}     # strength 1 = full undo of class weighting (previous behaviour), 0 = none
  selective: {target_coverage: 0.8, bin_tolerance: 0}

  species:                   # optional overrides of hab_uq_common.DEFAULT_SPECIES
    pDA: {alert_thresholds: [0.5, 1.0], measurement_sigma_dex: 0.15}
    Pseudo_nitzschia_seriata_group: {alert_thresholds: [10000, 100000]}

  evaluation:
    n_bootstrap: 200                # was 500 (pilot)
    # Evaluation-only provenance subsets of the test samples (models unchanged).
    # Also run standalone on finished runs: python -m sit_fuse.pipelines.habs.uq.hab_uq_subset_eval -y <this yaml>
    # Source filters need the non-strict table (the strict CSV has no source/method columns).
    subset_insitu_file: "/mnt/data1/habs/insitu_augmented_clean/combined_augmented.csv"   # was insitu_augmented_chain/
    subsets:
      oos_piers: {sources: oos_piers}              # combined_full + calhabmap_erddap (CalHABMAP piers, as in the 2026 paper)
      # non_pier: {exclude_sources: oos_piers}     # IFCB, SeaBASS, cruise; empty while IFCB is excluded
    subset_recalibrate_fusion: false               # true: fusion weights from subset calibration rows only

  fusion:
    pool: log                # linear | log | poe
    ref_local_hour: 10.0     # pier sampling ~09-10 local
    tau_hours: 4.0
    quality: selective       # none | selective | entropy
    temporal_filter: true
    transition_stay: 0.7

  animation:                 # hab_uq_animate: one MP4 per species x stream from uq.out_dir/fused
    out_dir: "/mnt/data1/HAB_COMBINED_RUNS/MERGED_TEST_111526/uq_pilot_coast_windows_piers/animations/"   # one MP4 per window
    streams: [filtered, fused]   # filtered = gap-filled daily; fused = observed days only
    format: mp4              # mp4 (H.264, plays in PowerPoint) | gif
    fps: 4
    dpi: 110
    insitu_overlay: true     # samples within +/- overlay_days, coloured by bin; rings = test days
    overlay_days: 1
    land_mask: land_10       # Natural Earth land drawn grey; none to skip
    extent: null             # [lon_min, lon_max, lat_min, lat_max]; null = product grid
    threshold_index: 0       # first alert threshold (P. seriata 10k cells/L, pDA 0.5 ng/mL)


compute:
  num_threads: medium
  num_loader_workers: 10     # optional; HAB training template default is 10
  nice: 10
  use_gpu: True



run_head_export: true

inference:
  stages: [heads]
  input_lists: [files_test, files_train]
  date_windows: *pilot_windows    # = uq.date_windows (replaces start_date / end_date)
  start_date: *pilot_start        # overall bounds, used only without date_windows
  end_date: *pilot_end
  overwrite: false                # existing *.head_outputs.tif are skipped
  model_configs:                  # required: see note below
    pace:  {no_trop: "/home/nlahaye/SIT_FUSE/src/sit_fuse/config/model/train_model_PACE_OCI.yaml"}
    olci:  {no_trop: "/home/nlahaye/SIT_FUSE/src/sit_fuse/config/model/train_model_OLCI.yaml"}
    viirs: {no_trop: "/home/nlahaye/SIT_FUSE/src/sit_fuse/config/model/train_model_VIIRS.yaml"}
    modis: {no_trop: "/home/nlahaye/SIT_FUSE/src/sit_fuse/config/model/train_model_AQUA_MODIS.yaml"}
  data_overrides:                 # inference only; model YAMLs are not modified
    reader_kwargs: {ocean_mask_source: land_10}   # was ocean_basins_50 (applies where mask_oceans is set)
    sampling:
      edge_fill: {enabled: true, min_valid: 4}    # keep centres with >= 4 of 9 valid window pixels

# Same-day composite order inside a group's daily product (first valid pixel wins;
# later platforms fill gaps). Default: s3a, s3b and snpp, jpss1, jpss2.
platform_priority:
  olci: [s3a, s3b]
  viirs: [jpss2, jpss1, snpp]


head_export:
  top_k_parent: 5                 # parent_top1..5_prob
  top_k_child: 3                  # child top1..3 under each parent rank
  n_parent_ranks: 2               # r1_* and r2_* child distributions
  mc:  {samples: 0}               # optional, see below
  ood: {enabled: false}           # optional, see below
  validate: true
  min_joint_agreement: 0.99

