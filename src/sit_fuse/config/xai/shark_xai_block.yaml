# Great hammerhead xai block. Merge into the encoder config with
#   python -m sit_fuse.xai.make_xai_config -b config/model/copernicus_shark.yaml \
#       -x config/xai/shark_xai_block.yaml -o config/model/copernicus_shark_xai.yaml
# copernicus_shark.yaml says number_channels: 6 (unused by the non-conv DBN; the model has 29 inputs);
# make_xai_config sets it to 29 in the merged copy. Scene files are checked for 29 channels by cluster_interpret.
#
# Channel order = cop_env_shark_t<i>.zarr channel order, i.e. the data_dict order in
# NatureNet models/misc/preprocess_copernicus.py.bak ("0.25" group first, then "0.083"; vars in list order).
# TODO: confirm against the data_dict in the preprocess_copernicus YAML used for the shark scenes.
#   0 nppv   1 o2   2 ph   3 dissic   4 fe   5 no3   6 po4   7 si   8 phyc            (BGC, 0.25 deg)
#   9 zooc  10 zos  11 sea_surface_temperature_anomaly  12 uo  13 vo  14 so  15 thetao  16 wo   (0.083 deg)
#  17 VCMX 18 VHM0 19 VHM0_SW1 20 VHM0_WW 21 VMDR 22 VMDR_SW1 23 VMDR_WW 24 VMXL 25 VPED
#  26 VTM01_SW1 27 VTM01_WW 28 VTPK                                                   (waves, 3-hourly)
xai:
  output_mode: assigned_logprob
  attribution_level: channel           # 29 players -> KernelSHAP; "group" gives 8 exact group players
  background: kmeans
  n_background: 50
  background_pool: 20000
  max_samples_per_cluster: 200
  min_cluster_samples: 10
  max_clusters: 0
  exact_max_players: 12
  data_split: train
  seed: 42
  feature_names: [nppv, o2, ph, dissic, fe, no3, po4, si, phyc,
                  zooc, zos, sea_surface_temperature_anomaly, uo, vo, so, thetao, wo,
                  VCMX, VHM0, VHM0_SW1, VHM0_WW, VMDR, VMDR_SW1, VMDR_WW, VMXL, VPED, VTM01_SW1, VTM01_WW, VTPK]
  feature_groups:
    hydrography: [thetao, so, zos, sea_surface_temperature_anomaly]
    currents: [uo, vo, wo]
    total_waves: [VCMX, VHM0, VMDR, VMXL, VPED, VTPK]
    swell: [VHM0_SW1, VMDR_SW1, VTM01_SW1]
    wind_waves: [VHM0_WW, VMDR_WW, VTM01_WW]
    productivity: [nppv, zooc, phyc]
    oxygen: [o2]
    carbonate_nutrients: [ph, dissic, fe, no3, po4, si]
  faithfulness:
    n_curve_samples: 50
    n_random_orders: 10
    n_permutations: 5
    top_k: 3
    stability_backgrounds: [kmeans, sample, zero]
    stability_seeds: [0, 1, 2]
    stability_sample_sizes: [50, 100, 200]
  interpret:
    label_pattern: "{out_dir}/{name}.clust.data_{n_classes}clusters.zarr.full_geo.tif"   # TODO: confirm suffix
    variable_names: [nppv, o2, ph, dissic, fe, no3, po4, si, phyc,
                     zooc, zos, sea_surface_temperature_anomaly, uo, vo, so, thetao, wo,
                     VCMX, VHM0, VHM0_SW1, VHM0_WW, VMDR, VMDR_SW1, VMDR_WW, VMXL, VPED, VTM01_SW1, VTM01_WW, VTPK]
    dates: []
    label_fill: -1
    n_top_clusters: 30
    min_cluster_pixels: 50
    max_pixels_per_scene: 20000
    surrogate_depths: [3, 4, 6]
    n_splits: 5
    external:
      sst: thetao
      front_percentile: 90
      u: uo
      v: vo
      ow_threshold: 0.2
      pixel_km: 9.25
      masks: {}
