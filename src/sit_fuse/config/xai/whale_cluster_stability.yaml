# Cluster stability across encoder runs (whales). Only if you trained more than one encoder (seeds / subsets):
#   python -m sit_fuse.xai.cluster_stability -y config/xai/whale_cluster_stability.yaml
# Every run lists one label raster per scene, same scenes in the same order.
runs:
  seed0: []   # TODO: label rasters of run 1, e.g. <out_dir_seed0>/cop_env_whales_t9.zarr.clust.data_<K>clusters.zarr.full_geo.tif
  seed1: []   # TODO
  seed2: []   # TODO
scenes: []    # optional raw scenes for centroid matching, e.g. /data/nlahaye/NatureNet_Env/Copernicus/cop_env_whales_t9.zarr
sit_fuse_config: config/model/copernicus_whale_xai.yaml   # output of make_xai_config
variable_names: [T, U, V, zooc, npp, CHL]
label_fill: -1
max_pixels: 500000
min_cluster_pixels: 50
seed: 0
out_dir: /data/nlahaye/output/Learnergy/COP_WHALE_STABILITY/   # TODO
