# v2 scenes / encoders.
# Cluster stability across seed variants (whales). This file is the template; the runs are filled in by
#   python -m sit_fuse.train.seed_variants stability -y config/seeds/whale_seed_variants_v2.yaml
# which writes config/xai/whale_cluster_stability_v2_seeds.yaml (main + seed runs, holdout scenes present in every run),
# then: python -m sit_fuse.xai.cluster_stability -y config/xai/whale_cluster_stability_v2_seeds.yaml
# Every run lists one label raster per scene, same scenes in the same order.
runs:
  seed0: []   # TODO: label rasters of run 1, e.g. <out_dir_seed0>/cop_env_whales_t9.zarr.clust.data_<K>clusters.zarr.full_geo.tif
  seed1: []   # TODO
  seed2: []   # TODO
scenes: []    # optional raw scenes for centroid matching, e.g. /data/nlahaye/NatureNet_Env/Copernicus/v2/whales/cop_env_whales_t9.zarr
sit_fuse_config: config/model/copernicus_whale_v2_xai.yaml   # output of make_xai_config
variable_names: []   # unused by cluster_stability (channel order: the v2 env meta JSON)
label_fill: -1
label_scale: 1000   # .no_geo.tif rasters store cluster id / 1000
max_pixels: 500000
min_cluster_pixels: 50
seed: 0
out_dir: /data/nlahaye/output/Learnergy/COP_WHALE_V2_STABILITY/   # TODO
