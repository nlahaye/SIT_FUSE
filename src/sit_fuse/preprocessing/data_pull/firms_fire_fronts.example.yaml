# =============================================================================
# FIRMS fire fronts: pull (pull_firms_fire_fronts.py) + rasterize
# (rasterize_fire_fronts.py). Both scripts read this file.
#
#   python pull_firms_fire_fronts.py firms_fire_fronts.example.yaml
#   python rasterize_fire_fronts.py  firms_fire_fronts.example.yaml
#
# Coverage of the FEDS fire-front layers (VEDA OGC API, no key):
#   2018-2021 archive, 2025-01 -> 2025-03 NRT snapshot, 2025-03 -> present NRT
#   large fires. Other years (e.g. Park fire 2024): use local FEDS vectors
#   (feds.local_vectors) and / or FIRMS detections (firms.local_csv or the
#   Area API) and derive fronts from VIIRS detections.
# Relative input paths (local_vectors, local_csv) are resolved against the
# directory of this file. Use absolute output paths if pull and rasterize are
# run from different working directories.
# =============================================================================

time_range:
  start: "2025-01-07T00:00:00Z"
  end: "2025-01-31T23:59:59Z"

bbox:                       # same bbox as the SIT-FUSE scenes (LA fires shown)
  min_lon: -119.2
  min_lat: 33.7
  max_lon: -117.6
  max_lat: 34.6

output:
  outdir: ./firms_fire_fronts_out
  vector_formats: [parquet, gpkg]   # parquet = GeoParquet; gpkg for QGIS builds without Parquet

overwrite: false

# -----------------------------------------------------------------------------
# FEDS VIIRS modeled fire perimeters / active fire fronts
# -----------------------------------------------------------------------------
feds:
  enabled: true
  # auto: local_vectors when given, else the VEDA API | local | api | both
  source: auto
  # Local FEDS vectors (fireatlas outputs / downloads): files, globs or
  # directories (searched recursively for .fgb .gpkg .shp .geojson .parquet).
  # Layer from the file / GPKG layer name: perimeter, fireline, newfirepix
  # (also lf_perimeter.fgb, ...); nfplist / uptonow are skipped. Step time from
  # `t` (or time / date) or YYYYMMDD[AM|PM] in the path (Snapshot/20240726PM/,
  # Largefire/F123_20240726PM/); fireid from fireID / fireid or F<id>_ in the path.
  local_vectors: []
  #   - /data/nlahaye/feds/CONUS/2024/Largefire/     # directory
  #   - ./feds/**/*.fgb                              # glob
  # or per layer:
  # local_vectors:
  #   fireline: [/data/feds/park_fireline.gpkg]
  #   perimeter: [/data/feds/park_perimeter.gpkg]
  #   newfirepix: [/data/feds/park_newfirepix.gpkg]
  local_crs: EPSG:9311       # CRS for local files without one (fireatlas default)
  api_url: https://openveda.cloud/api/features
  layers: [fireline, perimeter, newfirepix]
  collections: auto          # or {fireline: [public.eis_fire_lf_fireline_nrt], ...}
  page_limit: 1000
  time_pad_hours: 12         # query pad around time_range (steps are 12-h labels)
  # Estimated overpass time per step: t_date + LST hour - lon/15 h
  # (AM = night VIIRS overpass ~01:30 LST, PM = day overpass ~13:30 LST)
  overpass_lst_hours: {AM: 1.5, PM: 13.5}

# -----------------------------------------------------------------------------
# FIRMS active fire detections (fronts derived in the rasterizer)
# -----------------------------------------------------------------------------
firms:
  enabled: auto              # auto: on when sources or local_csv are given | true | false
  api_url: https://firms.modaps.eosdis.nasa.gov/api/area/csv
  map_key_env: FIRMS_MAP_KEY
  # Area API sources: LANDSAT_NRT (US/Canada, 30 m, 2022-06-20 on; no SP),
  # MODIS_NRT/SP, VIIRS_SNPP_NRT/SP, VIIRS_NOAA20_NRT/SP, VIIRS_NOAA21_NRT/SP.
  # Science-quality (*_SP) lags NRT by a few months; list both to cover the gap
  # (NRT rows are dropped on dates where the same satellite has SP data).
  sources: [VIIRS_SNPP_SP, VIIRS_NOAA20_SP, VIIRS_NOAA21_SP]
  # All instruments:
  # sources: [LANDSAT_NRT, MODIS_SP, MODIS_NRT, VIIRS_SNPP_SP, VIIRS_SNPP_NRT,
  #           VIIRS_NOAA20_SP, VIIRS_NOAA20_NRT, VIIRS_NOAA21_SP, VIIRS_NOAA21_NRT]
  prefer_standard_processing: true
  day_range: 5               # API maximum
  request_pause_seconds: 0.5
  # FIRMS archive-download files (string or list; files, globs, directories):
  # .csv / .json / .shp or the DL_FIRE_*.zip itself. Without a MAP_KEY the
  # Area API sources are skipped and only these are used.
  local_csv: []
  #   - /data/nlahaye/firms/DL_FIRE_SV-C2_*/fire_*.csv
  #   - /data/nlahaye/firms/DL_FIRE_J1V-C2_123456.zip
  # firms_source label; null = from the file name (fire_archive_SV-C2_* ->
  # VIIRS_SNPP_SP, fire_nrt_J1V-C2_* -> VIIRS_NOAA20_NRT; M-C61 = MODIS,
  # J2V-C2 = NOAA-21), so NRT rows are superseded by SP rows of the same satellite
  local_source_name: null
  # Archive `type` (SP files only): 0 presumed vegetation fire, 1 active volcano,
  # 2 other static land source (industrial), 3 offshore. null = keep all.
  keep_types: [0]
  min_confidence: nominal    # low | nominal | high (MODIS: <30 low, 30-79 nominal, >=80 high)
  include_night: true
  overpass_gap_minutes: 20   # detections of one satellite closer than this = one overpass

# -----------------------------------------------------------------------------
# Rasterizer
# -----------------------------------------------------------------------------
raster:
  outdir: null               # default <output.outdir>/rasters
  prefix: fire_front
  products: auto             # auto (every product with vectors) | [feds] | [firms] | [feds, firms]
  resolution_deg: 0.0025     # ~250 m; the matchup generator aggregates to the scene grid
  fill_value: 255
  classes: {front: 1, interior: 2, negative: 0}
  # Where 0 (no front reported) is written; outside it is NoData.
  #   ring - within ring_km of the step's fire geometry (default)
  #   bbox - the whole bbox (assumes the overpass saw it all, cloud free)
  #   none - positive-only reference (like HMS)
  negative_zone: ring
  ring_km: 25
  feds:
    front_buffer_m: 375      # half-width around the fire line (VIIRS I-band pixel)
    include_newfirepix: true # new pixels of the step are front as well
    newfirepix_size_m: 375
    interior: true           # perimeter area not on the front -> classes.interior
    perimeter_persist_hours: 72
  firms:
    front_mode: new          # new: pixels new vs. lookback = front, others interior | all
    lookback_hours: 24
    min_prior_gap_minutes: 30  # prior detections must be this much older (excludes the same overpass;
                               # SNPP and NOAA-20 overpasses are ~50 min apart)
    new_distance_m: 750      # a detection is new if no prior detection is within this distance
    min_confidence: nominal
