# pull_viirs_aerosol_type.py example config.
# Use the SAME bbox, resolution_deg and footprint_scale as the pull_adp.py
# config, so VIIRS, ADP and SIT-FUSE outputs share one grid.

#time_range:
#  start: "2024-07-23T00:00:00Z"
#  end:   "2024-08-15T23:59:59Z"

#time_range:
#  start: "2025-01-05T00:00:00Z"
#  end: "2025-01-17T23:59:59Z"

time_range:
  start: "2026-07-01T00:00:00Z"
  end: "2026-07-22T23:59:59Z"

bbox:
  min_lon: -125.45
  min_lat: 31.31
  max_lon: -101.98
  max_lat: 49.01

raster:
  resolution_deg: 0.05      # same as ADP; VIIRS DB pixels are ~6 km at nadir
  footprint_scale: 0.55
  fill_value: 255           # unobserved; written as GeoTIFF nodata
  dtype: uint8

# CMR collections. Per platform and granule time, the first listed version
# that exists is used. Pin ONE version per platform for a consistent record:
# in Oct 2026 CMR has v2 (002) for SNPP/NOAA-20 throughout 2024, while v2.1
# (021) reprocessing covers NOAA-20 only from 2024-08 on and NOAA-21 only in
# 2025. Listing ["2.1", "2"] would mix versions within one event.
collections:
  - {short_name: AERDB_L2_VIIRS_SNPP,   versions: ["2"]}
  - {short_name: AERDB_L2_VIIRS_NOAA20, versions: ["2"]}
  - {short_name: AERDB_L2_VIIRS_NOAA21, versions: ["2.1"]}
day_only: true

aerosol_type:
  variable: Aerosol_Type_Land_Ocean   # or Aerosol_Type_Land (land only)
  # 0 dust, 1 smoke, 2 high-altitude smoke, 3 pyroCb, 4 non-smoke fine mode,
  # 5 mixed, 6 background, 7 fine dominated (Land_Ocean only), -999 fill
  smoke_values: [1, 2, 3]
  negative_values: [0, 4, 6, 7]       # 5 (mixed) and -999 -> unobserved
  min_qa: 1          # AOT QA flag (land 1 poor / 2 moderate / 3 good; ocean 1 / 3); 0 = off
  qa_applies_to: all # all | negatives (keep low-QA smoke, drop low-QA negatives)

overpass:
  max_gap_seconds: 600      # consecutive 6-min granules of one platform -> one raster
  min_observed_pixels: 1    # skip overpasses with fewer observed grid cells in bbox

output:
  outdir: ./viirs_aerdb_out
  prefix: viirs_smoke       # -> rasters/viirs_smoke_YYYYMMDDTHHMMSSZ_NOAA20.tif
  keep_nc: true
  write_granule_rasters: false

#auth:
#  #token_env: EARTHDATA_TOKEN   # bearer token; falls back to ~/.netrc if unset

overwrite: true
